nsated stage.", "tr": "", "m": "", "g": "signs", "sl": "C22", "lec": "Cardio-vascular Function", "sn": 22}, {"c": "c2", "s": "Level 2 · Intermediate", "l": 2, "t": "Clinical", "q": "A capillary refill time suggestive of shock in the lecture is:", "o": ["> 2 s", "> 10 s", "> 3 s", "> 1 s"], "a": [2], "w": ["The opening ICP case had a normal CRT of 2 s.", "Far beyond the threshold.", "Correct (slide 22).", "Normal is ≤ 2 s."], "e": "Skin window: cold, pale or mottled extremities; capillary refill > 3 s.", "tr": "", "m": "", "g": "crt", "sl": "C22", "lec": "Cardio-vascular Function", "sn": 22}, {"c": "c2", "s": "Level 2 · Intermediate", "l": 2, "t": "Mechanism", "q": "Within SECONDS of a fall in blood pressure, the main compensation is:", "o": ["Increased red cell production", "Vasopressin (ADH) release", "The baroreflex: ↑ sympathetic output → ↑ HR, ↑ contractility, arteriolar constriction and venoconstriction", "The renin–angiotensin–aldosterone system"], "a": [2], "w": ["Days.", "Minutes to hours.", "Correct (slide 21).", "Minutes to hours."], "e": "Seconds = nerves (baroreflex via carotid sinus and aortic arch → vasomotor centre). Minutes–hours = hormones (catecholamines, RAAS, ADH → vasoconstriction + salt and water retention).", "tr": "", "m": "", "g": "comp", "sl": "C21", "lec": "Cardio-vascular Function", "sn": 21}, {"c": "c2", "s": "Level 3 · Advanced", "l": 3, "t": "Mechanism", "q": "Why does venoconstriction help in early haemorrhage?", "o": ["It increases O₂ extraction.", "It lowers SVR.", "It reduces heart rate.", "It raises the mean systemic filling pressure (Psf) → ↑ venous return → ↑ preload."], "a": [3], "w": ["Not its role.", "Arteriolar constriction raises SVR; venoconstriction acts on the reservoir.", "No.", "Correct (slide 21)."], "e": "Veins hold ≈ ⅔ of the blood. Squeezing them moves blood towards the heart: Psf ↑ → venous return ↑.", "tr": "", "m": "", "g": "veno", "sl": "C21", "lec": "Cardio-vascular Function", "sn": 21}, {"c": "c2", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Where are the arterial baroreceptors that trigger the compensation of shock?", "o": ["Medulla oblongata", "Carotid body and aortic body", "Right atrium and pulmonary veins only", "Carotid sinus and aortic arch"], "a": [3], "w": ["That is the integration centre (vasomotor centre).", "These are CHEMOreceptors.", "Not the arterial baroreceptors of the slide.", "Correct (slide 21)."], "e": "Afferents: carotid sinus nerve and aortic depressor nerve → vasomotor centre → sympathetic nerves to heart (contractility, HR), vessels (tone) and kidney (renin release, natriuresis).", "tr": "Sinus = pressure (baroreceptors); body = chemistry (chemoreceptors).", "m": "", "g": "baro", "sl": "C21", "lec": "Cardio-vascular Function", "sn": 21}, {"c": "c2", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "During compensation of shock, blood flow is preferentially preserved to:", "o": ["Liver and spleen", "Brain and heart", "Kidneys and muscles", "Skin and gut"], "a": [1], "w": ["No.", "Correct (slide 21).", "The kidney is sacrificed (oliguria).", "These are sacrificed."], "e": "Flow is diverted away from skin, gut and kidneys to protect brain and heart — hence the “fast, pale, cold and thirsty” bleeding patient.", "tr": "", "m": "", "g": "priority", "sl": "C21", "lec": "Cardio-vascular Function", "sn": 21}, {"c": "c2", "s": "Level 3 · Advanced", "l": 3, "t": "Concept", "q": "A shocked patient is tachycardic with cool skin; BP is normal. Lactate is 1.6 mmol/L. Which stage is this?", "o": ["No shock: BP is normal", "Decompensated shock", "Compensated shock", "Irreversible shock"], "a": [2], "w": ["A normal BP does not exclude shock.", "BP falls and lactate rises in this stage.", "Correct (slide 23).", "Organ failure despite restoration."], "e": "Stage 1 compensated: reflexes hold the pressure; tachycardia, cool skin; BP may be normal. Stage 2 decompensated: BP falls, lactate rises, organs fail. Stage 3 irreversible: cell death continues even if circulation is restored.", "tr": "", "m": "", "g": "stages", "sl": "C23", "lec": "Cardio-vascular Function", "sn": 23}, {"c": "c2", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Irreversible shock is defined by:", "o": ["A MAP below 65 mmHg", "A lactate above 2 mmol/L", "The need for vasopressors", "Cell death and organ failure that continue even if circulation is restored"], "a": [3], "w": ["That can occur in decompensated shock.", "Already present in decompensated shock.", "Not the definition.", "Correct (slide 23)."], "e": "Hence the urgency: support the circulation early, fix the cause fast.", "tr": "", "m": "", "g": "irrev", "sl": "C23", "lec": "Cardio-vascular Function", "sn": 23}, {"c": "c2", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "In the lecture’s “measuring the circulation” slide, central venous pressure (CVP) is used as an estimate of:", "o": ["Left ventricular contractility", "Cardiac output", "Systemic vascular resistance", "Preload of the right heart"], "a": [3], "w": ["No.", "Flow is measured by echo, Fick, thermodilution.", "No.", "Correct (slide 24)."], "e": "Pressure: BP cuff, arterial line, CVP ≈ RV preload, Swan–Ganz. Flow: echo, Fick, thermodilution, ultrasonic flowmetry, bioimpedance. Oxygen: ABG, lactate, SvO₂/ScvO₂, SpO₂.", "tr": "", "m": "", "g": "assess", "sl": "C24", "lec": "Cardio-vascular Function", "sn": 24}, {"c": "c2", "s": "Level 2 · Intermediate", "l": 2, "t": "Classification", "q": "Which tool assesses FLOW (not pressure or oxygen) in the lecture’s classification?", "o": ["Echocardiography (stroke volume)", "Arterial line", "Pulse oximetry", "Arterial lactate"], "a": [0], "w": ["Correct (slides 24, 29).", "Pressure.", "Oxygen.", "Oxygen/cellular perfusion."], "e": "Each tool answers one question: is the pressure enough? is the flow enough? are the cells getting O₂?", "tr": "", "m": "", "g": "assess", "sl": "C24", "lec": "Cardio-vascular Function", "sn": 24}, {"c": "c2", "s": "Level 3 · Advanced", "l": 3, "t": "Concept", "q": "According to the lecture, arterial blood gas analysis in shock is used to obtain: (multiple answers)", "o": ["pH and bicarbonate", "Stroke volume", "Venous oxygen saturation (with a venous sample)", "Arterial lactate"], "a": [0, 2, 3], "w": ["Correct (slide 24).", "Echocardiography.", "Correct (slide 30).", "Correct (slide 30)."], "e": "Lactate > 2 mmol/L = cellular hypoxia; low SvO₂ = increased extraction (low flow); pH/HCO₃⁻ = metabolic acidosis.", "tr": "", "m": "", "g": "abg", "sl": "C30", "lec": "Cardio-vascular Function", "sn": 30}, {"c": "c2", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "On an ICU monitor, the arterial pressure reads “130/62 (76)”. The value in brackets is:", "o": ["The mean arterial pressure", "The pulse pressure", "The central venous pressure", "The heart rate"], "a": [0], "w": ["Correct: MAP ≈ 62 + (130 − 62)/3 ≈ 85 by formula; the monitor integrates the curve.", "Pulse pressure = 130 − 62 = 68.", "Displayed separately (PVC/CVP).", "HR is displayed separately."], "e": "Invasive arterial pressure gives systolic/diastolic and the mean. Monitors calculate MAP from the area under the pressure curve, so it can differ slightly from the bedside formula.", "tr": "", "m": "", "g": "monitor", "sl": "C28", "lec": "Cardio-vascular Function", "sn": 28}, {"c": "c3", "s": "Level 1 · Basic", "l": 1, "t": "Classification", "q": "Match the image to the shock: “the pipes are too wide”.", "o": ["Obstructive", "Cardiogenic", "Hypovolaemic", "Distributive"], "a": [3], "w": ["“The circuit is blocked.”", "“The pump fails.”", "“The tank is empty.”", "Correct (slide 31)."], "e": "Vasodilation + leaky capillaries → ↓ SVR, blood pools.", "tr": "", "m": "", "g": "4shocks", "sl": "C31", "lec": "Cardio-vascular Function", "sn": 31}, {"c": "c3", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Which type of shock is the only one with a LOW systemic vascular resistance?", "o": ["Distributive", "Cardiogenic", "Obstructive", "Hypovolaemic"], "a": [0], "w": ["Correct (slide 32).", "SVR ↑.", "SVR ↑.", "SVR ↑ (compensation)."], "e": "In the three others, SVR rises as the body tries to compensate a low CO. Distributive: CO ↑ or normal, CVP ↓ or normal, SVR ↓, warm skin (early).", "tr": "", "m": "", "g": "fingerprint", "sl": "C32", "lec": "Cardio-vascular Function", "sn": 32}, {"c": "c3", "s": "Level 3 · Advanced", "l": 3, "t": "Concept", "q": "Which TWO types of shock have a HIGH preload (CVP)?", "o": ["Distributive and obstructive", "Cardiogenic and obstructive", "Hypovolaemic and distributive", "Hypovolaemic and cardiogenic"], "a": [1], "w": ["Distributive has low/normal preload.", "Correct: blood backs up behind a failing pump or a blockage.", "Both have low/normal preload.", "Hypovolaemic has low preload."], "e": "“The preload tells you whether the tank is empty (low) or the blood is backing up (high)” (slide 32).", "tr": "", "m": "", "g": "fingerprint", "sl": "C32", "lec": "Cardio-vascular Function", "sn": 32}, {"c": "c3", "s": "Level 2 · Intermediate", "l": 2, "t": "Clinical", "q": "Warm skin in a shocked patient (early) suggests:", "o": ["Hypovolaemic shock", "Distributive shock", "Obstructive shock", "Cardiogenic shock"], "a": [1], "w": ["Cold skin.", "Correct (slide 32).", "Cold skin.", "Cold skin."], "e": "Vasodilation keeps the skin warm early in sepsis/anaphylaxis; in the other shocks vasoconstriction makes it cold.", "tr": "", "m": "", "g": "skin", "sl": "C32", "lec": "Cardio-vascular Function", "sn": 32}, {"c": "c3", "s": "Level 2 · Intermediate", "l": 2, "t": "Mechanism", "q": "The mechanism of hypovolaemic shock in the right order is:", "o": ["Volume loss → ↓ Psf → ↓ venous return → ↓ preload/SV → ↓ CO", "↓ CO → ↓ Psf → ↓ venous return → volume loss", "Volume loss → ↓ contractility → ↓ CO", "Volume loss → ↓ SVR → ↓ preload → ↓ CO"], "a": [0], "w": ["Correct (slide 33).", "Reversed.", "Contractility is the cardiogenic mechanism.", "SVR rises in hypovolaemia."], "e": "“The tank is empty.” Causes: haemorrhage (trauma, GI bleeding, ruptured ectopic), GI losses, extensive burns (plasma), severe dehydration.", "tr": "", "m": "", "g": "hypo", "sl": "C33", "lec": "Cardio-vascular Function", "sn": 33}, {"c": "c3", "s": "Level 2 · Intermediate", "l": 2, "t": "Classification", "q": "Which is a cause of hypovolaemic shock in the lecture?", "o": ["Extensive burns (plasma loss)", "Tension pneumothorax", "High-grade AV block", "Anaphylaxis"], "a": [0], "w": ["Correct (slide 33).", "Obstructive.", "Cardiogenic.", "Distributive."], "e": "Hypovolaemic: haemorrhage (trauma, GI bleeding, ruptured ectopic pregnancy), severe diarrhoea and vomiting, extensive burns, severe dehydration.", "tr": "Burns appear twice: “extensive burns (plasma loss)” = hypovolaemic; “major burns” as severe inflammation = distributive.", "m": "", "g": "hypocause", "sl": "C33", "lec": "Cardio-vascular Function", "sn": 33}, {"c": "c3", "s": "Level 2 · Intermediate", "l": 2, "t": "Classification", "q": "Which of the following are causes of CARDIOGENIC shock? (multiple answers)", "o": ["High-grade AV block", "Cardiac tamponade", "Acute mitral regurgitation or septal rupture", "Myocardial infarction"], "a": [0, 2, 3], "w": ["Rhythm disorder.", "Obstructive (the heart is squeezed from outside).", "Mechanical.", "↓ contractility."], "e": "Slide 34: ↓ contractility (MI, myocarditis, drug toxicity); rhythm (high-grade AV block, very fast tachycardias); mechanical (acute mitral/aortic regurgitation, septal rupture, intracardiac thrombus).", "tr": "Tamponade is NOT cardiogenic: the pump is normal, the circuit is blocked.", "m": "", "g": "cardiocause", "sl": "C34", "lec": "Cardio-vascular Function", "sn": 34}, {"c": "c3", "s": "Level 3 · Advanced", "l": 3, "t": "Mechanism", "q": "Why is cardiogenic shock a vicious circle?", "o": ["Because SVR falls.", "Because tachycardia increases preload.", "Low BP reduces coronary perfusion → more ischaemia → weaker pump → lower BP.", "Because fluids always cure it."], "a": [2], "w": ["SVR rises.", "No.", "Correct (slide 34).", "Fluids can drown a failing pump."], "e": "Systolic dysfunction → ↓ CO, hypotension, ↓ coronary perfusion pressure; diastolic dysfunction → ↑ LVEDP, pulmonary congestion, hypoxaemia → ischaemia → progressive myocardial dysfunction → death.", "tr": "", "m": "", "g": "vicious", "sl": "C34", "lec": "Cardio-vascular Function", "sn": 34}, {"c": "c3", "s": "Level 2 · Intermediate", "l": 2, "t": "Classification", "q": "The MOST common cause of distributive shock is:", "o": ["Pancreatitis", "Anaphylaxis", "Sepsis", "Neurogenic (spinal) shock"], "a": [2], "w": ["Severe inflammation, rarer.", "A cause, but not the most common.", "Correct (slide 36).", "A cause, but rarer."], "e": "Distributive causes: septic (most common), anaphylactic, neurogenic (spinal cord injury), severe inflammation (pancreatitis, major burns).", "tr": "", "m": "", "g": "distcause", "sl": "C36", "lec": "Cardio-vascular Function", "sn": 36}, {"c": "c3", "s": "Level 3 · Advanced", "l": 3, "t": "Mechanism", "q": "In the lecture’s chain for distributive shock, the sequence is:", "o": ["↑ SVR → ↓ CO → ↓ preload → shock", "Relative hypovolaemia → vasodilation → ↓ O₂ extraction → altered regional flow", "Altered regional blood-flow distribution → ↓ tissue O₂ extraction → ↑ capillary permeability and peripheral vasodilation → relative hypovolaemia", "Bacteria → tamponade → shock"], "a": [2], "w": ["That is not distributive.", "Reversed.", "Correct (slide 37).", "No."], "e": "Low SVR, CO often high (Guyton high-output state), MAP falls, flow badly distributed — cells still starve.", "tr": "", "m": "", "g": "distchain", "sl": "C37", "lec": "Cardio-vascular Function", "sn": 37}, {"c": "c3", "s": "Level 2 · Intermediate", "l": 2, "t": "Classification", "q": "Which of the following are causes of OBSTRUCTIVE shock? (multiple answers)", "o": ["Septal rupture", "Massive pulmonary embolism", "Tension pneumothorax", "Cardiac tamponade"], "a": [1, 2, 3], "w": ["Mechanical cause of CARDIOGENIC shock.", "Correct.", "Correct.", "Correct."], "e": "Obstructive: filling or ejection mechanically prevented → ↑ RAP/CVP → ↓ venous return or ↓ SV → ↓ CO. Treatment = remove the obstacle.", "tr": "", "m": "", "g": "obscause", "sl": "C38", "lec": "Cardio-vascular Function", "sn": 38}, {"c": "c3", "s": "Level 4 · Expert", "l": 4, "t": "Graph", "q": "According to the lecture, cardiac tamponade shifts the cardiac output (cardiac function) curve:", "o": ["Right and down: the heart needs a higher RAP to fill", "Up and right", "Up and left", "It does not move; only Pmc changes"], "a": [0], "w": ["Correct (slide 38).", "No.", "That is sympathetic stimulation.", "Tamponade acts on the heart’s filling."], "e": "The pericardial fluid squeezes the heart, so filling requires a higher pressure; CO falls while CVP rises. Treatment: pericardiocentesis.", "tr": "", "m": "", "g": "tamponade", "sl": "C38", "lec": "Cardio-vascular Function", "sn": 38}, {"c": "c3", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "Case A: 25-year-old motorcyclist with a femur fracture, HR 128, BP 100/70, cold pale skin, FLAT neck veins. Expected haemodynamics:", "o": ["CO ↓, CVP ↑, SVR ↑ — obstructive shock", "CO ↓, CVP ↑, SVR ↑ — cardiogenic shock", "CO ↓, CVP ↓, SVR ↑ — hypovolaemic shock", "CO ↑, CVP ↓, SVR ↓ — distributive shock"], "a": [2], "w": ["Neck veins would be distended.", "Neck veins would be distended.", "Correct.", "Skin would be warm."], "e": "Femur fracture → large hidden blood loss. BP still 100/70 = compensated (SVR ↑↑, HR ↑). Flat neck veins = empty tank.", "tr": "", "m": "", "g": "caseA", "sl": "C39", "lec": "Cardio-vascular Function", "sn": 39}, {"c": "c3", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "Case B: 68-year-old, crushing chest pain for 3 h, BP 80/50, crackles in both lungs, distended neck veins. The shock is:", "o": ["Hypovolaemic", "Obstructive (tamponade)", "Distributive", "Cardiogenic"], "a": [3], "w": ["Neck veins would be flat.", "Lungs would be clear.", "No warm skin/fever.", "Correct: MI → pump failure, blood backs up (crackles, distended veins)."], "e": "CO ↓, CVP ↑, SVR ↑. Treatment: dobutamine, cautious fluids; reopen the coronary artery.", "tr": "", "m": "", "g": "caseB", "sl": "C39", "lec": "Cardio-vascular Function", "sn": 39}, {"c": "c3", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "Case C: 45-year-old with pneumonia, T 39.5 °C, BP 82/40, warm hands, bounding pulse, lactate 4.5 mmol/L. Which statement is correct?", "o": ["Lactate 4.5 is normal in fever.", "It is hypovolaemic shock; give blood.", "It is septic (distributive) shock: SVR ↓, CO ↑ or normal; treat with fluids + noradrenaline and antibiotics with source control.", "It is cardiogenic shock; give dobutamine only."], "a": [2], "w": ["> 2 mmol/L = cellular hypoxia.", "No bleeding.", "Correct.", "Warm hands and bounding pulse = high-output vasodilated state."], "e": "Distributive: low SVR, warm skin early, CO often high but badly distributed; SvO₂ may be normal or high.", "tr": "", "m": "", "g": "caseC", "sl": "C39", "lec": "Cardio-vascular Function", "sn": 39}, {"c": "c3", "s": "Level 4 · Expert", "l": 4, "t": "Clinical", "q": "Case D: stab wound to the chest, BP 70/50, distended neck veins, muffled heart sounds, CLEAR lungs. What distinguishes it from Case B (cardiogenic)?", "o": ["Hypotension", "Clear lungs with muffled heart sounds: the heart is compressed from outside (tamponade) rather than failing and congesting the lungs", "A high SVR", "Distended neck veins"], "a": [1], "w": ["Present in both.", "Correct.", "Present in both.", "Present in both."], "e": "Obstructive shock (tamponade): CO ↓, CVP ↑, SVR ↑. Treatment: pericardiocentesis (remove the obstacle); fluids only as a temporary bridge.", "tr": "", "m": "", "g": "caseD", "sl": "C39", "lec": "Cardio-vascular Function", "sn": 39}, {"c": "c3", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "In the “V-I-P” support of the circulation, “P (Pump)” means:", "o": ["Packed red cells", "Pulse oximetry", "Vasoactive drugs: noradrenaline (↑ SVR), dobutamine (↑ contractility), adrenaline (both)", "Pericardiocentesis"], "a": [2], "w": ["That is “I — Infuse”.", "Monitoring.", "Correct (slide 40).", "That is a cause-specific treatment for tamponade."], "e": "V = Ventilate (O₂ → ↑ SaO₂ → ↑ CaO₂); I = Infuse (fluids/blood → ↑ Psf → ↑ venous return → ↑ preload); P = Pump (vasoactive drugs).", "tr": "", "m": "“VIP: Ventilate, Infuse, Pump.”", "g": "vip", "sl": "C40", "lec": "Cardio-vascular Function", "sn": 40}, {"c": "c3", "s": "Level 3 · Advanced", "l": 3, "t": "Concept", "q": "Which drug primarily increases myocardial contractility?", "o": ["Dobutamine", "Naloxone", "Noradrenaline", "Acetazolamide"], "a": [0], "w": ["Correct (slide 40).", "Opioid antagonist (respiratory lecture).", "Mainly ↑ SVR (vasoconstriction).", "Decreases CSF production."], "e": "Noradrenaline ↑ SVR; dobutamine ↑ contractility; adrenaline does both.", "tr": "", "m": "", "g": "drugs", "sl": "C40", "lec": "Cardio-vascular Function", "sn": 40}, {"c": "c3", "s": "Level 3 · Advanced", "l": 3, "t": "Concept", "q": "In ANAPHYLACTIC (distributive) shock, the vasoactive drug specifically mentioned in the lecture is:", "o": ["Mannitol", "Dobutamine", "Adrenaline", "Noradrenaline alone"], "a": [2], "w": ["ICP treatment.", "Used in cardiogenic shock.", "Correct (slide 41).", "Used in septic shock."], "e": "Distributive support = fluids + noradrenaline (adrenaline in anaphylaxis); fix the cause = antibiotics + source control, remove the allergen.", "tr": "", "m": "", "g": "anaphylaxis", "sl": "C41", "lec": "Cardio-vascular Function", "sn": 41}, {"c": "c3", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Match each shock with its cause-specific treatment. Which pairing is WRONG?", "o": ["Cardiogenic → reopen the coronary artery, treat arrhythmia or valve", "Obstructive → needle decompression/chest drain, thrombolysis", "Hypovolaemic → stop the bleeding/losses", "Distributive → pericardiocentesis"], "a": [3], "w": ["Correct pairing.", "Correct pairing.", "Correct pairing.", "Wrong: pericardiocentesis is for obstructive shock (tamponade)."], "e": "Distributive → antibiotics + source control; remove allergen. Support buys time; only treating the cause stops the shock.", "tr": "", "m": "", "g": "fixcause", "sl": "C41", "lec": "Cardio-vascular Function", "sn": 41}, {"c": "c3", "s": "Level 4 · Expert", "l": 4, "t": "Integrated", "q": "“Giving a lot of fluid helps an empty tank — but can drown a failing pump.” The physiological reason is:", "o": ["Fluids reduce contractility directly.", "Fluids decrease Psf.", "On a flat, low cardiac function curve, extra preload adds little CO but raises CVP and causes congestion (pulmonary oedema).", "Fluids lower SVR in cardiogenic shock."], "a": [2], "w": ["No.", "Fluids increase Psf.", "Correct (slides 18, 41).", "Not the reason."], "e": "In hypovolaemia the heart is on the steep part of its curve: volume ↑ → CO ↑. In cardiogenic shock the curve is flat: volume ↑ → only CVP/LVEDP ↑ → congestion and hypoxaemia.", "tr": "", "m": "", "g": "fluidfail", "sl": "C41", "lec": "Cardio-vascular Function", "sn": 41}, {"c": "c3", "s": "Level 5 · Elite", "l": 5, "t": "Elite", "q": "A septic patient has MAP 58 mmHg, CO 8 L/min, SvO₂ 82 % and lactate 5 mmol/L. Which interpretation is MOST accurate?", "o": ["The patient is hypovolaemic and needs only blood.", "Cells are not using the O₂ delivered (extraction failure); lactate confirms cellular hypoxia despite a high flow.", "High SvO₂ proves tissue oxygenation is adequate.", "High CO excludes shock."], "a": [1], "w": ["Pattern is vasodilated, high-output.", "Correct.", "High SvO₂ in sepsis reflects failed extraction.", "Distributive shock often has high CO."], "e": "Slide 19: extraction fails in sepsis → SvO₂ normal or high despite shock. Slide 36: low SVR, CO often high, MAP falls, flow badly distributed, cells starve.", "tr": "", "m": "", "g": "elite1", "sl": "C19", "lec": "Cardio-vascular Function", "sn": 19}, {"c": "c3", "s": "Level 5 · Elite", "l": 5, "t": "Elite", "q": "In early haemorrhage, a baroreflex-driven venoconstriction and tachycardia occur. Using Guyton’s analysis, which combination best describes the two curves?", "o": ["Only the cardiac curve moves; the vascular curve is unaffected by haemorrhage.", "The vascular curve ends up ABOVE normal (venoconstriction over-compensates the loss) while the cardiac curve shifts down.", "Both curves shift down and the equilibrium has a higher CO.", "Vascular curve first shifts down (volume loss ↓ Psf), venoconstriction partly shifts it back up; the cardiac curve shifts up — the new equilibrium has a CO lower than normal but higher than without reflexes."], "a": [3], "w": ["Haemorrhage lowers Psf.", "Venoconstriction only partly restores Psf, and sympathetic stimulation lifts (not lowers) the cardiac curve.", "Contradictory.", "Correct: the best overall description."], "e": "Haemorrhage lowers Psf (slide 14); compensation (slide 21) raises Psf (venoconstriction) and lifts the cardiac curve (sympathetic stimulation, slide 12). Net: CO partially defended.", "tr": "Compensation PARTLY restores Psf and CO — it never brings them above normal while blood is still missing.", "m": "", "g": "elite2", "sl": "C12", "lec": "Cardio-vascular Function", "sn": 12}, {"c": "r1", "s": "Level 1 · Basic", "l": 1, "t": "Concept", "q": "Every minute at rest, the respiratory system must take up about ___ of O₂ and remove about ___ of CO₂.", "o": ["250 mL; 200 mL", "500 mL; 500 mL", "1000 mL; 800 mL", "200 mL; 250 mL"], "a": [0], "w": ["Correct (slide 3).", "500 mL is the tidal volume.", "1000 mL/min is O₂ DELIVERY (cardiovascular lecture).", "Inverted."], "e": "Goal: keep PaO₂ ≈ 95 mmHg and PaCO₂ ≈ 40 mmHg. CO₂ production (200) < O₂ uptake (250) → respiratory quotient 0.8, used in the alveolar gas equation.", "tr": "", "m": "", "g": "goal", "sl": "R3", "lec": "Respiratory Function", "sn": 3}, {"c": "r1", "s": "Level 2 · Intermediate", "l": 2, "t": "Classification", "q": "Which component’s failure typically causes HYPOVENTILATION with a rise in PaCO₂?", "o": ["Alveoli and capillaries", "Control and pump (brainstem, nerves, muscles, chest wall)", "Blood (haemoglobin, cardiac output)", "Upper airway mucosa only"], "a": [1], "w": ["Causes gas-exchange failure (↓ PaO₂).", "Correct (slide 3).", "Causes tissue hypoxia with normal lungs.", "Airways cause obstruction."], "e": "Examples: opioid overdose, Guillain–Barré, flail chest. Four components: control & pump, airways, alveoli–capillaries, blood.", "tr": "", "m": "", "g": "4comp", "sl": "R3", "lec": "Respiratory Function", "sn": 3}, {"c": "r1", "s": "Level 2 · Intermediate", "l": 2, "t": "Clinical", "q": "A C3–C5 spinal cord injury causes respiratory failure mainly by affecting:", "o": ["The respiratory pump (phrenic nerve → diaphragm) → hypoventilation, ↑ PaCO₂", "The upper airway", "The alveoli", "The pulmonary circulation"], "a": [0], "w": ["Correct (slide 11).", "No.", "Not directly.", "No."], "e": "“C3, 4, 5 keeps the diaphragm alive.” Pump failure = not enough ventilation → hypercapnia.", "tr": "", "m": "", "g": "structure", "sl": "R11", "lec": "Respiratory Function", "sn": 11}, {"c": "r1", "s": "Level 1 · Basic", "l": 1, "t": "Concept", "q": "The functional unit of gas exchange is:", "o": ["The alveolus", "The terminal bronchiole", "The trachea", "The pleura"], "a": [0], "w": ["Correct (slide 9).", "Last part of the conducting zone.", "Conducting zone.", "Part of the pump."], "e": "Conducting zone (no exchange = anatomical dead space) vs respiratory zone (respiratory bronchioles, alveolar ducts, alveoli).", "tr": "", "m": "", "g": "zones", "sl": "R9", "lec": "Respiratory Function", "sn": 9}, {"c": "r1", "s": "Level 2 · Intermediate", "l": 2, "t": "Mechanism", "q": "During a quiet inspiration:", "o": ["Alveolar pressure becomes positive, pushing air in.", "Pleural pressure rises to 0.", "Expiration is active, inspiration is passive.", "The diaphragm contracts, pleural pressure falls from ≈ −5 to −8 cmH₂O, alveolar pressure becomes slightly negative and air flows in."], "a": [3], "w": ["Air flows from high (atmosphere) to low (alveolus).", "That is a pneumothorax.", "The reverse.", "Correct (slides 12, 15)."], "e": "At end-inspiration flow is zero and alveolar = atmospheric pressure; expiration is passive (lung recoil makes alveolar pressure positive).", "tr": "", "m": "", "g": "breath", "sl": "R12", "lec": "Respiratory Function", "sn": 12}, {"c": "r1", "s": "Level 3 · Advanced", "l": 3, "t": "Calculation", "q": "During inspiration, alveolar pressure is −1 cmH₂O and intrapleural pressure −8 cmH₂O. The transmural (transpulmonary) pressure is:", "o": ["+1 cmH₂O", "−9 cmH₂O", "+7 cmH₂O", "−7 cmH₂O"], "a": [2], "w": ["No.", "Added instead of subtracted.", "Correct: −1 − (−8) = +7.", "Sign error."], "e": "Transmural = P alveolar − P pleural. At end-expiration: 0 − (−5) = +5 cmH₂O. A positive transmural pressure keeps the lung open.", "tr": "", "m": "", "g": "transmural", "sl": "R15", "lec": "Respiratory Function", "sn": 15}, {"c": "r1", "s": "Level 2 · Intermediate", "l": 2, "t": "Clinical", "q": "In a pneumothorax, what happens to the lung and the chest wall?", "o": ["Nothing changes because the pleura has no pressure.", "Intrapleural pressure becomes more negative.", "Intrapleural pressure becomes 0 (atmospheric): the lung collapses and the chest wall expands outward.", "The lung expands and the chest wall collapses."], "a": [2], "w": ["Normal Ppl ≈ −5 cmH₂O.", "It rises to atmospheric.", "Correct (slide 16).", "Inverted."], "e": "The negative pleural pressure normally couples the inward recoil of the lung with the outward recoil of the chest wall. Lose it, and each springs to its own resting position.", "tr": "", "m": "", "g": "ptx", "sl": "R16", "lec": "Respiratory Function", "sn": 16}, {"c": "r1", "s": "Level 1 · Basic", "l": 1, "t": "Equation", "q": "Compliance is defined as:", "o": ["ΔP / ΔV", "Flow / pressure", "ΔV / ΔP", "Pressure × resistance"], "a": [2], "w": ["That is elastance (the inverse).", "That is conductance.", "Correct (slide 14).", "No."], "e": "High compliance = inflates easily (emphysema); low compliance = stiff (fibrosis, ARDS, oedema). Measured with transpulmonary pressure (alveolar − pleural; pleural from an oesophageal balloon).", "tr": "", "m": "", "g": "compliance", "sl": "R14", "lec": "Respiratory Function", "sn": 14}, {"c": "r1", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Lung compliance is HIGHEST:", "o": ["It is constant at all volumes", "At residual volume only", "In the middle of the volume range, around FRC", "Near total lung capacity"], "a": [2], "w": ["The P–V curve is not linear.", "No.", "Correct (slide 14).", "Compliance falls near TLC (lung already stretched)."], "e": "This also explains why the base (smaller alveoli on the steep part of the curve) is better ventilated than the apex.", "tr": "", "m": "", "g": "compliance", "sl": "R14", "lec": "Respiratory Function", "sn": 14}, {"c": "r1", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "Which condition INCREASES lung compliance?", "o": ["Pulmonary fibrosis", "ARDS", "Emphysema", "Pulmonary oedema"], "a": [2], "w": ["↓ compliance.", "↓ compliance.", "Correct: loss of elastic recoil → fills easily, empties poorly → air trapping, ↑ FRC.", "↓ compliance."], "e": "Slide 19 table: ↓ lung compliance (fibrosis, ARDS, oedema) → fast shallow breathing, ↓ TLC; ↑ lung compliance (emphysema, barrel chest) → air trapping, ↑ FRC.", "tr": "", "m": "", "g": "compclin", "sl": "R19", "lec": "Respiratory Function", "sn": 19}, {"c": "r1", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Surfactant:", "o": ["Increases the work of breathing", "Lowers surface tension, increases compliance and keeps small alveoli open", "Is excessive in premature babies", "Is produced by type I alveolar cells"], "a": [1], "w": ["It decreases it.", "Correct (slide 18).", "It is lacking → neonatal RDS.", "Type II cells."], "e": "No surfactant → alveoli collapse at end-expiration → atelectasis, hypoxaemia (neonatal RDS) → treated with surfactant.", "tr": "", "m": "", "g": "surfactant", "sl": "R18", "lec": "Respiratory Function", "sn": 18}, {"c": "r1", "s": "Level 3 · Advanced", "l": 3, "t": "Concept", "q": "At functional residual capacity (FRC), with respiratory muscles relaxed:", "o": ["The inward recoil of the lung is exactly balanced by the outward recoil of the chest wall", "Alveolar pressure is −8 cmH₂O", "Both tend to expand", "Both lung and chest wall tend to collapse inward"], "a": [0], "w": ["Correct (slides 17, 19).", "At rest alveolar pressure = 0.", "The lung tends to collapse.", "The chest wall tends to expand at FRC."], "e": "Relaxation pressure of the respiratory system = algebraic sum of lung and chest-wall recoil. Two springs: stiffen or weaken one, and FRC moves.", "tr": "", "m": "", "g": "frc", "sl": "R17", "lec": "Respiratory Function", "sn": 17}, {"c": "r1", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "An obese patient with normal lungs has a reduced FRC and TLC. In the lecture’s terms this is because of:", "o": ["Lack of surfactant", "↓ chest-wall compliance — normal lungs in a “box” that is too tight", "Bronchospasm", "↑ lung compliance"], "a": [1], "w": ["No.", "Correct (slide 19).", "Obstructive, not restrictive.", "Would increase FRC."], "e": "Other examples: kyphoscoliosis, chest burns. This is an extraparenchymal restrictive pattern.", "tr": "", "m": "", "g": "chestwall", "sl": "R19", "lec": "Respiratory Function", "sn": 19}, {"c": "r1", "s": "Level 2 · Intermediate", "l": 2, "t": "Equation", "q": "According to Poiseuille’s law, if the airway radius is HALVED (length and pressure unchanged), resistance:", "o": ["Doubles", "Quadruples", "Halves", "Increases 16-fold"], "a": [3], "w": ["That is what happens when LENGTH doubles.", "r² — wrong exponent.", "Opposite direction.", "Correct: R ∝ 1/r⁴ → 2⁴ = 16."], "e": "Resistance ∝ length / r⁴; flow at constant pressure falls to 1/16. Small changes in radius (bronchospasm, oedema, mucus) → huge changes in resistance — asthma can turn severe fast.", "tr": "", "m": "“Half the radius, sixteen times the trouble.”", "g": "poiseuille", "sl": "R21", "lec": "Respiratory Function", "sn": 21}, {"c": "r1", "s": "Level 3 · Advanced", "l": 3, "t": "Calculation", "q": "If the length of a tube doubles (radius and driving pressure unchanged), the flow:", "o": ["Falls to one half", "Falls to 1/16", "Doubles", "Is unchanged"], "a": [0], "w": ["Correct (slide 21): resistance doubles.", "That is for halving the radius.", "Opposite.", "Resistance ∝ length."], "e": "R ∝ L/r⁴. Doubling L doubles R; at constant pressure flow halves.", "tr": "", "m": "", "g": "poiseuille", "sl": "R21", "lec": "Respiratory Function", "sn": 21}, {"c": "r1", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Turbulent airflow typically occurs:", "o": ["In small peripheral airways where velocity is low", "At high flow rates in the trachea and larger airways", "Only during sleep", "Only in alveoli"], "a": [1], "w": ["That is laminar flow.", "Correct (slide 20).", "No.", "Gas moves by diffusion there."], "e": "Laminar (small airways): flow ∝ driving pressure. Turbulent (trachea, large airways): flow ∝ √ driving pressure. Transitional: larger airways, branches, narrowings.", "tr": "", "m": "", "g": "flowtype", "sl": "R20", "lec": "Respiratory Function", "sn": 20}, {"c": "r1", "s": "Level 2 · Intermediate", "l": 2, "t": "Mechanism", "q": "Parasympathetic (vagal) stimulation of the airways causes:", "o": ["Bronchodilation via M3 receptors", "Bronchoconstriction and more mucus via M3 muscarinic receptors", "Bronchodilation via β2 receptors", "No effect: airways have no autonomic innervation"], "a": [1], "w": ["M3 → constriction.", "Correct (slide 22).", "Sympathetic/adrenaline.", "The vagus is the main nerve control."], "e": "Blocked by anticholinergics (ipratropium). Sympathetic: few direct nerves, mainly circulating adrenaline → β2 → bronchodilation; mimicked by salbutamol.", "tr": "", "m": "", "g": "autonomic", "sl": "R22", "lec": "Respiratory Function", "sn": 22}, {"c": "r1", "s": "Level 3 · Advanced", "l": 3, "t": "Concept", "q": "Match the drug to its mechanism. Which is correct?", "o": ["Salbutamol — β2 agonist mimicking adrenaline → bronchodilation", "Naloxone — bronchodilator", "Salbutamol — blocks the vagus", "Ipratropium — β2 agonist"], "a": [0], "w": ["Correct (slide 22).", "Naloxone reverses opioids.", "That is ipratropium.", "Ipratropium is an anticholinergic (blocks M3)."], "e": "Treatment = physiology: β2 stimulation and vagal blockade both widen the airways; steroids treat inflammation.", "tr": "", "m": "", "g": "drugs", "sl": "R22", "lec": "Respiratory Function", "sn": 22}, {"c": "r1", "s": "Level 3 · Advanced", "l": 3, "t": "Mechanism", "q": "Why do asthma and COPD patients breathe at a HIGH lung volume (hyperinflation)?", "o": ["Because surfactant works only at high volume.", "Because compliance is highest near TLC.", "Because at high lung volume radial traction pulls the airways open, lowering resistance.", "Because dead space falls at high volume."], "a": [2], "w": ["No.", "Compliance is lowest near TLC.", "Correct (slide 23).", "Not the mechanism."], "e": "Airway resistance falls as lung volume rises. At low volume, less traction → small airways narrow or collapse. Pursed-lip breathing in COPD also keeps airways open.", "tr": "", "m": "", "g": "volres", "sl": "R23", "lec": "Respiratory Function", "sn": 23}, {"c": "r1", "s": "Level 1 · Basic", "l": 1, "t": "Equation", "q": "Minute ventilation (V̇E) is calculated as:", "o": ["Respiratory rate × tidal volume", "Respiratory rate × (tidal volume − dead space)", "Tidal volume ÷ respiratory rate", "Tidal volume − dead space"], "a": [0], "w": ["Correct (slide 25).", "That is alveolar ventilation.", "No.", "Missing the rate."], "e": "V̇E = R × VT; V̇A = R × (VT − VD) = V̇E − V̇D.", "tr": "", "m": "", "g": "ve", "sl": "R25", "lec": "Respiratory Function", "sn": 25}, {"c": "r1", "s": "Level 3 · Advanced", "l": 3, "t": "Calculation", "q": "RR 15/min, VT 500 mL, VD 150 mL. Alveolar ventilation is:", "o": ["350 mL/min", "5.25 L/min", "2.25 L/min", "7.5 L/min"], "a": [1], "w": ["Forgot to multiply by RR.", "Correct: 15 × (500 − 150) = 5250 mL/min.", "That is dead-space ventilation (15 × 150).", "That is minute ventilation."], "e": "Slide 25 worked example. Only air that reaches the alveoli takes part in gas exchange.", "tr": "", "m": "", "g": "va", "sl": "R25", "lec": "Respiratory Function", "sn": 25}, {"c": "r1", "s": "Level 4 · Expert", "l": 4, "t": "Calculation", "q": "A patient with rib fractures breathes 30 times/min with VT 250 mL (VD 150 mL). Compared with a normal person breathing 15 × 500 mL:", "o": ["Both have the same alveolar ventilation because V̇E is 7.5 L/min in both.", "His V̇A is only 3 L/min versus 5.25 L/min, despite the same V̇E.", "His V̇A is 7.5 L/min.", "His V̇A is higher because he breathes faster."], "a": [1], "w": ["V̇E is the same, V̇A is not.", "Correct: 30 × (250 − 150) = 3000 mL/min.", "That is V̇E.", "Dead space is ventilated with every breath."], "e": "Fast, shallow breathing: VT close to dead space → V̇A falls even if V̇E looks normal (slide 30). PaCO₂ will rise.", "tr": "A normal minute ventilation can hide alveolar hypoventilation.", "m": "", "g": "va", "sl": "R30", "lec": "Respiratory Function", "sn": 30}, {"c": "r1", "s": "Level 2 · Intermediate", "l": 2, "t": "Calculation", "q": "The PO₂ of humidified inspired air at sea level (PiO₂) is approximately:", "o": ["160 mmHg", "47 mmHg", "150 mmHg", "100 mmHg"], "a": [2], "w": ["That is dry air (0.21 × 760); you must subtract water vapour.", "That is water vapour pressure.", "Correct: 0.21 × (760 − 47) ≈ 150 (slide 28).", "That is alveolar PO₂."], "e": "In the airways air is warmed to 37 °C and saturated with water vapour (47 mmHg): PiO₂ = FiO₂ × (PB − 47).", "tr": "Forgetting the 47 mmHg is the classic error.", "m": "", "g": "pio2", "sl": "R27", "lec": "Respiratory Function", "sn": 27}, {"c": "r1", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Dalton’s law states that:", "o": ["Resistance is proportional to 1/r⁴.", "Volume is inversely proportional to pressure.", "Gas diffuses in proportion to surface area.", "Each gas in a mixture exerts a partial pressure = its fraction × total pressure, and partial pressures add up to the total."], "a": [3], "w": ["Poiseuille.", "Boyle’s law (not in the lecture).", "That is Fick’s law.", "Correct (slides 26–27)."], "e": "PO₂ dry air = 0.21 × 760 ≈ 160 mmHg; PN₂ ≈ 600 mmHg.", "tr": "", "m": "", "g": "dalton", "sl": "R27", "lec": "Respiratory Function", "sn": 27}, {"c": "r1", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "Which situation causes hypoxaemia with a NORMAL A–a gradient?", "o": ["Pulmonary fibrosis", "Pneumonia", "High altitude (low inspired PO₂)", "Asthma"], "a": [2], "w": ["Diffusion → ↑ A–a.", "Shunt → ↑ A–a.", "Correct (slide 30): PiO₂ ↓ → PAO₂ ↓ → PaO₂ ↓ — the lung itself works normally.", "Low V/Q → ↑ A–a."], "e": "Normal A–a: hypoventilation or low PiO₂ (altitude; top of Everest PiO₂ ≈ 43 mmHg). Increased A–a: V/Q mismatch, shunt, diffusion.", "tr": "", "m": "", "g": "ventfail", "sl": "R30", "lec": "Respiratory Function", "sn": 30}, {"c": "r1", "s": "Level 2 · Intermediate", "l": 2, "t": "Clinical", "q": "Hyperventilation in a panic attack causes:", "o": ["Metabolic acidosis", "Respiratory acidosis", "Low PaCO₂ and respiratory alkalosis (tingling, dizziness)", "High PaCO₂"], "a": [2], "w": ["Not caused by hyperventilation.", "Hypoventilation causes respiratory acidosis.", "Correct (slide 30).", "Opposite."], "e": "PaCO₂ is the mirror of alveolar ventilation: ↑ V̇A → ↓ PaCO₂. Also in pain and early asthma.", "tr": "", "m": "", "g": "hypervent", "sl": "R30", "lec": "Respiratory Function", "sn": 30}, {"c": "r1", "s": "Level 3 · Advanced", "l": 3, "t": "Concept", "q": "In ALVEOLAR HYPOVENTILATION (slide 29), alveolar gases become approximately:", "o": ["PAO₂ 40, PACO₂ 46", "PAO₂ 100, PACO₂ 40", "PAO₂ 80, PACO₂ 60", "PAO₂ 150, PACO₂ 0"], "a": [2], "w": ["Mixed venous blood.", "Normal.", "Correct (slide 29).", "Inspired air."], "e": "Less fresh air → O₂ falls and CO₂ accumulates in the alveoli, and arterial blood equilibrates with them (PaO₂ 80, PaCO₂ 60).", "tr": "", "m": "", "g": "pp", "sl": "R29", "lec": "Respiratory Function", "sn": 29}, {"c": "r2", "s": "Level 2 · Intermediate", "l": 2, "t": "Equation", "q": "According to Fick’s law of diffusion, gas transfer across the alveolar membrane DECREASES when:", "o": ["Surface area increases", "The partial-pressure difference increases", "The membrane thickens", "The diffusion constant increases"], "a": [2], "w": ["Increases transfer.", "Increases transfer.", "Correct (slides 31–32).", "Increases transfer."], "e": "V̇gas = A × D × (P1 − P2) / T. Thickness is in the denominator.", "tr": "", "m": "", "g": "fick", "sl": "R31", "lec": "Respiratory Function", "sn": 31}, {"c": "r2", "s": "Level 3 · Advanced", "l": 3, "t": "Mechanism", "q": "Why does a diffusion problem cause hypoxaemia while PaCO₂ usually stays normal or low?", "o": ["CO₂ diffuses about 20 times faster than O₂ (D depends on solubility ÷ √MW).", "CO₂ is carried only as bicarbonate.", "CO₂ does not need to cross the alveolar membrane.", "O₂ is more soluble than CO₂."], "a": [0], "w": ["Correct (slide 32).", "Irrelevant to diffusion speed.", "It does cross it.", "CO₂ is much more soluble."], "e": "So a diffusion problem = hypoxaemia first. PaCO₂ may even be low because hypoxaemia drives hyperventilation.", "tr": "", "m": "", "g": "co2fast", "sl": "R32", "lec": "Respiratory Function", "sn": 32}, {"c": "r2", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "In interstitial fibrosis, hypoxaemia is typically worse on exercise because:", "o": ["Dead space increases on exercise.", "Surfactant disappears on exercise.", "CO₂ diffusion fails.", "The thickened membrane slows O₂ transfer and on exercise blood spends less time in the capillary."], "a": [3], "w": ["Not the mechanism given.", "No.", "CO₂ is spared.", "Correct (slides 33–34)."], "e": "Fibrosis ↑ thickness (T); emphysema ↓ surface area (A) → ↓ DLCO. Both → hypoxaemia, worse with exercise.", "tr": "", "m": "", "g": "diffclin", "sl": "R33", "lec": "Respiratory Function", "sn": 33}, {"c": "r2", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "A reduced DLCO due to LOSS OF SURFACE AREA is typical of:", "o": ["Opioid overdose", "Interstitial oedema", "High altitude", "Emphysema or lung resection"], "a": [3], "w": ["Hypoventilation.", "↑ thickness.", "↓ pressure difference.", "Correct (slide 34)."], "e": "Fewer alveoli and capillaries → ↓ A in Fick’s law → ↓ DLCO.", "tr": "", "m": "", "g": "dlco", "sl": "R34", "lec": "Respiratory Function", "sn": 34}, {"c": "r2", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "In the upright lung, the V/Q ratio is:", "o": ["Low at the apex (≈ 0.6) and high at the base (≈ 3)", "High at the apex (≈ 3) and low at the base (≈ 0.6)", "Infinite at the base", "Equal to 1 everywhere"], "a": [1], "w": ["Inverted.", "Correct (slide 35).", "No.", "No."], "e": "Both ventilation and perfusion are greater at the base, but perfusion rises even more steeply from apex to base.", "tr": "", "m": "", "g": "vqgrad", "sl": "R35", "lec": "Respiratory Function", "sn": 35}, {"c": "r2", "s": "Level 3 · Advanced", "l": 3, "t": "Mechanism", "q": "Why is the BASE of the upright lung better ventilated than the apex?", "o": ["Because the bronchi to the base are wider.", "Because basal alveoli are smaller and sit on the steep part of the compliance curve.", "Because blood flow is lower at the base.", "Because apical alveoli are smaller."], "a": [1], "w": ["Not the reason given.", "Correct (slide 35).", "Blood flow is higher at the base.", "Apical alveoli are larger (already stretched)."], "e": "Apex: alveoli already stretched → less compliant → less ventilation.", "tr": "", "m": "", "g": "vqgrad", "sl": "R35", "lec": "Respiratory Function", "sn": 35}, {"c": "r2", "s": "Level 3 · Advanced", "l": 3, "t": "Concept", "q": "In West zone 1, the relationship of pressures is:", "o": ["Pv > Pa > PA", "Pa > Pv > PA", "PA > Pa > Pv (no blood flow)", "Pa > PA > Pv"], "a": [2], "w": ["Not a West zone.", "Zone 3.", "Correct (slide 36).", "Zone 2."], "e": "Zone 1 (apex): alveolar pressure exceeds arterial pressure → capillaries collapse → no flow (alveolar dead space). Zone 3 (base): continuous flow.", "tr": "", "m": "", "g": "west", "sl": "R36", "lec": "Respiratory Function", "sn": 36}, {"c": "r2", "s": "Level 2 · Intermediate", "l": 2, "t": "Classification", "q": "A region with V/Q = 0 (perfused but not ventilated) is called:", "o": ["Dead space", "Low V/Q", "Matched unit", "Shunt"], "a": [3], "w": ["V/Q = ∞.", "Some ventilation remains.", "V/Q ≈ 1.", "Correct (slide 38)."], "e": "Shunt: blood passes alveoli with no air → hypoxaemia that responds poorly to O₂ (pneumonia, atelectasis, ARDS → Patient 3).", "tr": "", "m": "", "g": "vqtypes", "sl": "R38", "lec": "Respiratory Function", "sn": 38}, {"c": "r2", "s": "Level 3 · Advanced", "l": 3, "t": "Mechanism", "q": "Why does hypoxaemia due to SHUNT respond poorly to supplemental O₂?", "o": ["Shunted blood never meets the extra O₂, and blood from normal alveoli is already nearly fully saturated, so it cannot compensate.", "Because O₂ cannot diffuse in any alveolus.", "Because O₂ causes bronchospasm.", "Because shunt raises PaCO₂ massively."], "a": [0], "w": ["Correct.", "Normal alveoli still work.", "No.", "PaCO₂ is often normal or low."], "e": "In low V/Q, raising FiO₂ raises PAO₂ in poorly ventilated units → PaO₂ improves. In shunt the alveoli are full of fluid/pus.", "tr": "", "m": "", "g": "shunt", "sl": "R38", "lec": "Respiratory Function", "sn": 38}, {"c": "r2", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "Pulmonary embolism creates ventilated but unperfused lung. A typical consequence described in the lecture is:", "o": ["V/Q = 0", "A reduced PaCO₂–ETCO₂ gap", "Wasted ventilation with an increased PaCO₂–ETCO₂ gap", "Hypoxic vasoconstriction"], "a": [2], "w": ["That is shunt.", "The gap INCREASES.", "Correct (slide 38).", "That is the response to POORLY VENTILATED alveoli."], "e": "Dead space (V/Q = ∞): air with no blood → exhaled CO₂ from these units is ≈ 0, so ETCO₂ falls below PaCO₂.", "tr": "", "m": "", "g": "deadspace", "sl": "R38", "lec": "Respiratory Function", "sn": 38}, {"c": "r2", "s": "Level 3 · Advanced", "l": 3, "t": "Mechanism", "q": "Hypoxic pulmonary vasoconstriction:", "o": ["Dilates vessels of poorly ventilated alveoli", "Is enhanced in sepsis", "Constricts vessels of poorly ventilated alveoli, sending blood to well-ventilated ones — the lung’s defence against V/Q mismatch", "Is improved by giving excess O₂ in COPD"], "a": [2], "w": ["It constricts them.", "It is LOST in sepsis.", "Correct (slide 38).", "Too much O₂ in COPD releases it and worsens V/Q."], "e": "Improves V/Q matching. Lost in sepsis; excess O₂ in COPD worsens V/Q (one reason PaCO₂ rises).", "tr": "", "m": "", "g": "hpv", "sl": "R38", "lec": "Respiratory Function", "sn": 38}, {"c": "r2", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "The MOST common cause of hypoxaemia in clinical practice is:", "o": ["Low inspired O₂", "V/Q mismatch", "Hypoventilation", "Diffusion impairment"], "a": [1], "w": ["Only at altitude.", "Correct (slide 38).", "Less common.", "Less common."], "e": "Asthma, COPD (low V/Q), pneumonia (shunt), PE (dead space with redistribution).", "tr": "", "m": "", "g": "vqcommon", "sl": "R38", "lec": "Respiratory Function", "sn": 38}, {"c": "r2", "s": "Level 1 · Basic", "l": 1, "t": "Concept", "q": "About what proportion of arterial O₂ content is bound to haemoglobin?", "o": ["98 %", "100 %, none is dissolved", "70 %", "50 %"], "a": [0], "w": ["Correct (slide 39).", "A small amount is dissolved (3 mL/L at PaO₂ 100).", "That is the CO₂-as-bicarbonate figure.", "Far too low."], "e": "Dissolved O₂ = 0.003 mL/dL per mmHg → 0.3 mL/dL = 3 mL/L at PaO₂ 100 mmHg.", "tr": "", "m": "", "g": "o2forms", "sl": "R39", "lec": "Respiratory Function", "sn": 39}, {"c": "r2", "s": "Level 2 · Intermediate", "l": 2, "t": "Graph", "q": "Which change shifts the O₂–Hb dissociation curve to the RIGHT (O₂ released more easily)? (multiple answers)", "o": ["Carbon monoxide", "↑ 2,3-DPG", "↑ temperature", "↑ pH (alkalosis)", "↑ PCO₂"], "a": [1, 2, 4], "w": ["Shifts LEFT (Hb holds O₂).", "Correct.", "Correct.", "Shifts LEFT.", "Correct."], "e": "Right shift: ↑ T, ↑ PCO₂, ↑ 2,3-DPG, ↓ pH (fever, acidosis, exercise). Left shift: alkalosis, cold, CO.", "tr": "", "m": "“CADET, face Right”: CO₂, Acid, DPG, Exercise, Temperature.", "g": "shift", "sl": "R39", "lec": "Respiratory Function", "sn": 39}, {"c": "r2", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "A patient has Hb 7 g/dL, SpO₂ 99 %, PaO₂ 98 mmHg. Which statement is correct?", "o": ["He has hypoxaemia.", "He needs 100 % O₂ as the main treatment.", "O₂ content is about half normal despite normal PaO₂ and SaO₂.", "O₂ delivery is normal because SpO₂ is normal."], "a": [2], "w": ["PaO₂ is normal — no hypoxaemia.", "O₂ adds little; Hb is the problem.", "Correct (slide 42).", "SpO₂ reflects saturation, not content."], "e": "CaO₂ = 1.34 × Hb × SaO₂: halving Hb halves content. Hypoxaemia (low PaO₂) ≠ hypoxia (low tissue O₂).", "tr": "", "m": "", "g": "anaemia", "sl": "R42", "lec": "Respiratory Function", "sn": 42}, {"c": "r2", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "In carbon monoxide poisoning (gas water heater, brazier):", "o": ["SpO₂ is falsely low.", "CO binds Hb ≈ 240× more than O₂, SpO₂ is falsely normal, and treatment is 100 % O₂.", "PaO₂ is always very low.", "The O₂–Hb curve shifts right."], "a": [1], "w": ["It is falsely NORMAL.", "Correct (slide 42).", "PaO₂ is usually normal (dissolved O₂ unaffected).", "CO shifts it left."], "e": "The oximeter reads carboxyhaemoglobin as oxyhaemoglobin. Tissue hypoxia with normal lungs.", "tr": "", "m": "", "g": "coposn", "sl": "R42", "lec": "Respiratory Function", "sn": 42}, {"c": "r2", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "CO₂ is carried in blood mainly as:", "o": ["Dissolved CO₂ (≈ 70 %)", "Bicarbonate (≈ 70 %), made in red cells by carbonic anhydrase", "Carbamino compounds (≈ 70 %)", "Carboxyhaemoglobin"], "a": [1], "w": ["Only ≈ 10 %.", "Correct (slide 41).", "≈ 20 %.", "That is CO, not CO₂."], "e": "CO₂ + H₂O → H⁺ + HCO₃⁻ (carbonic anhydrase), then HCO₃⁻ carried in plasma. Carbamino ≈ 20 %, dissolved ≈ 10 %.", "tr": "", "m": "", "g": "co2forms", "sl": "R41", "lec": "Respiratory Function", "sn": 41}, {"c": "r2", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "PaCO₂ is mainly determined by:", "o": ["Diffusion capacity", "Alveolar ventilation (relative to CO₂ production)", "Haemoglobin concentration", "FiO₂"], "a": [1], "w": ["CO₂ diffuses easily.", "Correct (slide 41).", "No.", "FiO₂ affects O₂, not CO₂ directly."], "e": "↓ ventilation → ↑ PaCO₂. “PaCO₂ is the mirror of alveolar ventilation.”", "tr": "", "m": "", "g": "paco2", "sl": "R41", "lec": "Respiratory Function", "sn": 41}, {"c": "r2", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Where is the respiratory control centre?", "o": ["Hypothalamus", "Cerebral cortex", "Medulla and pons", "Cerebellum"], "a": [2], "w": ["No.", "Not in the lecture’s loop.", "Correct (slide 43).", "No."], "e": "Sensors (peripheral and central chemoreceptors, pulmonary mechanoreceptors) → control centre (medulla, pons) → spinal cord → effectors (respiratory muscles, diaphragm).", "tr": "", "m": "", "g": "control", "sl": "R43", "lec": "Respiratory Function", "sn": 43}, {"c": "r2", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "Deep, fast breathing in diabetic ketoacidosis (Kussmaul breathing) is explained by:", "o": ["Depression of the respiratory centre", "Chemoreceptor stimulation by metabolic acidosis → ventilation ↑ to lower PaCO₂", "Chronic CO₂ retention", "A delayed feedback loop"], "a": [1], "w": ["That causes hypoventilation.", "Correct (slide 44).", "COPD.", "That is Cheyne–Stokes."], "e": "Respiratory compensation of a metabolic acidosis.", "tr": "", "m": "", "g": "kussmaul", "sl": "R44", "lec": "Respiratory Function", "sn": 44}, {"c": "r2", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "Breathing that grows and fades with pauses (apnoeas), seen in heart failure or stroke, is:", "o": ["Kussmaul breathing", "Pursed-lip breathing", "Stridor", "Cheyne–Stokes breathing (delayed feedback loop)"], "a": [3], "w": ["Deep and fast, regular.", "COPD manoeuvre.", "Upper airway noise.", "Correct (slide 44)."], "e": "A delayed feedback (e.g. slow circulation in heart failure) makes the controller over- and under-shoot.", "tr": "", "m": "", "g": "cheyne", "sl": "R44", "lec": "Respiratory Function", "sn": 44}, {"c": "r2", "s": "Level 4 · Expert", "l": 4, "t": "Integrated", "q": "Why can giving TOO MUCH O₂ raise PaCO₂ in a COPD patient with chronic CO₂ retention? (multiple answers)", "o": ["It increases CO₂ production by the cells", "Haldane effect: oxygenated Hb carries less CO₂", "Less hypoxic drive to breathe", "It worsens V/Q matching (releases hypoxic vasoconstriction)"], "a": [1, 2, 3], "w": ["Not a mechanism in the lecture.", "Correct (slide 44).", "Correct (slide 44).", "Correct (slides 38, 44)."], "e": "Hence target SpO₂ 88–92 % until ABG in patients at risk of CO₂ retention.", "tr": "", "m": "", "g": "copdo2", "sl": "R44", "lec": "Respiratory Function", "sn": 44}, {"c": "r2", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "According to the lecture, breathing is driven MAINLY by:", "o": ["PaO₂", "Blood pressure", "Lactate", "CO₂ (PaCO₂)"], "a": [3], "w": ["Secondary drive.", "No.", "Through pH in acidosis, but not the main drive.", "Correct (slide 44)."], "e": "When the brain stops responding (opioids, sedatives), ventilation falls and PaCO₂ rises.", "tr": "", "m": "", "g": "drive", "sl": "R44", "lec": "Respiratory Function", "sn": 44}, {"c": "r3", "s": "Level 1 · Basic", "l": 1, "t": "Concept", "q": "Which lung volume CANNOT be measured by simple spirometry?", "o": ["Inspiratory reserve volume", "Tidal volume", "Residual volume", "Expiratory reserve volume"], "a": [2], "w": ["Measurable.", "Measurable.", "Correct (slide 49).", "Measurable."], "e": "RV stays in the lung after maximal expiration, so it never passes through the spirometer. RV, FRC and TLC need body plethysmography or gas dilution.", "tr": "", "m": "", "g": "volumes", "sl": "R49", "lec": "Respiratory Function", "sn": 49}, {"c": "r3", "s": "Level 2 · Intermediate", "l": 2, "t": "Equation", "q": "Functional residual capacity (FRC) equals:", "o": ["All four volumes", "IRV + VT + ERV", "IRV + VT", "ERV + RV"], "a": [3], "w": ["That is TLC.", "That is vital capacity.", "That is inspiratory capacity.", "Correct (slide 50)."], "e": "FRC = air left in the lungs after a normal expiration. Capacities = sums of volumes.", "tr": "", "m": "", "g": "capacities", "sl": "R50", "lec": "Respiratory Function", "sn": 50}, {"c": "r3", "s": "Level 2 · Intermediate", "l": 2, "t": "Equation", "q": "Vital capacity (VC) is:", "o": ["ERV + RV", "IRV + VT + ERV (≈ 4.5–5 L)", "VT + IRV", "IRV + VT + ERV + RV"], "a": [1], "w": ["FRC.", "Correct (slide 50).", "IC.", "TLC."], "e": "FVC = VC measured with a forced expiration. TLC ≈ 6 L.", "tr": "", "m": "", "g": "capacities", "sl": "R50", "lec": "Respiratory Function", "sn": 50}, {"c": "r3", "s": "Level 3 · Advanced", "l": 3, "t": "Calculation", "q": "IRV 3.0 L, VT 0.5 L, ERV 1.2 L, RV 1.3 L. What are VC and TLC?", "o": ["VC 4.7 L; TLC 4.7 L", "VC 2.5 L; TLC 6.0 L", "VC 3.5 L; TLC 6.0 L", "VC 4.7 L; TLC 6.0 L"], "a": [3], "w": ["Forgot RV.", "2.5 = FRC.", "3.5 is IC.", "Correct: VC = 3.0 + 0.5 + 1.2; TLC = VC + RV."], "e": "IC = 3.5 L; FRC = 2.5 L; VC = 4.7 L; TLC = 6.0 L.", "tr": "", "m": "", "g": "capcalc", "sl": "R50", "lec": "Respiratory Function", "sn": 50}, {"c": "r3", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Which statement about pulse oximetry is correct?", "o": ["It measures PaCO₂.", "It is more accurate in shock with poor perfusion.", "It estimates arterial Hb saturation; normal ≥ 95 %; it is falsely normal in CO poisoning.", "It may under-read in dark skin."], "a": [2], "w": ["It says nothing about CO₂.", "Less accurate with poor perfusion.", "Correct (slide 52).", "It may OVER-read."], "e": "Limitations: poor perfusion, movement, carbon monoxide (falsely normal), dark skin (may over-read).", "tr": "", "m": "", "g": "spo2", "sl": "R52", "lec": "Respiratory Function", "sn": 52}, {"c": "r3", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "A COPD patient on high-flow O₂ has SpO₂ 98 % but becomes drowsy. The most useful next test is:", "o": ["Arterial blood gas (or capnography) to check PaCO₂", "Chest X-ray only", "Repeat pulse oximetry", "Spirometry"], "a": [0], "w": ["Correct (slide 52).", "Does not measure ventilation.", "SpO₂ says nothing about CO₂.", "Not in an acute drowsy patient."], "e": "“A patient on O₂ can have a normal SpO₂ and a rising PaCO₂.” Oxygenation (SpO₂/PaO₂) ≠ ventilation (ETCO₂/PaCO₂).", "tr": "", "m": "", "g": "spo2co2", "sl": "R52", "lec": "Respiratory Function", "sn": 52}, {"c": "r3", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Normal end-tidal CO₂ (ETCO₂) is:", "o": ["75–100 mmHg", "2–5 mmHg", "35–45 mmHg, about 2–5 mmHg below PaCO₂", "Equal to PaO₂"], "a": [2], "w": ["Far too high.", "That is the normal PaCO₂–ETCO₂ gap.", "Correct (slide 52).", "Unrelated."], "e": "Capnography assesses ventilation breath by breath; the gap increases with dead space.", "tr": "", "m": "", "g": "etco2", "sl": "R52", "lec": "Respiratory Function", "sn": 52}, {"c": "r3", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "An SaO₂ below 90 % corresponds to a PaO₂ of about:", "o": ["60 mmHg — the usual threshold for respiratory failure", "100 mmHg", "80 mmHg", "27 mmHg"], "a": [0], "w": ["Correct (slide 56).", "Normal PaO₂.", "SaO₂ would be ≈ 95 %.", "That is P₅₀ (50 % saturation)."], "e": "Below PaO₂ 60 the dissociation curve becomes steep: small falls in PaO₂ cause large falls in saturation.", "tr": "", "m": "", "g": "hypoxdef", "sl": "R56", "lec": "Respiratory Function", "sn": 56}, {"c": "r3", "s": "Level 2 · Intermediate", "l": 2, "t": "Equation", "q": "The alveolar gas equation used in the lecture is:", "o": ["PAO₂ = FiO₂ × (760 − 47) − PaCO₂/0.8", "PAO₂ = 0.8 × PaCO₂", "PAO₂ = FiO₂ × 760 − PaCO₂", "PAO₂ = PaO₂ − PaCO₂"], "a": [0], "w": ["Correct (slide 56).", "No.", "Forgets water vapour and RQ.", "No."], "e": "Room air: 150 − 40/0.8 = 100 mmHg. 0.8 = respiratory quotient (200 mL CO₂ / 250 mL O₂).", "tr": "", "m": "", "g": "pao2", "sl": "R56", "lec": "Respiratory Function", "sn": 56}, {"c": "r3", "s": "Level 3 · Advanced", "l": 3, "t": "Calculation", "q": "Room air, PaCO₂ 40 mmHg, PaO₂ 60 mmHg. The A–a gradient is:", "o": ["40 mmHg — increased", "10 mmHg — normal", "90 mmHg", "0 mmHg"], "a": [0], "w": ["Correct: PAO₂ = 150 − 40/0.8 = 100; A–a = 100 − 60 = 40.", "PAO₂ is 100, not 70.", "Used 150 as PAO₂.", "No."], "e": "Normal A–a < 10–15 mmHg. Increased → V/Q mismatch, shunt or diffusion problem.", "tr": "", "m": "", "g": "aagrad", "sl": "R56", "lec": "Respiratory Function", "sn": 56}, {"c": "r3", "s": "Level 4 · Expert", "l": 4, "t": "Calculation", "q": "Patient 1 (opioids): room air, PaCO₂ 75, PaO₂ 52 mmHg. Calculate the A–a gradient and the mechanism.", "o": ["PAO₂ ≈ 56; A–a ≈ 4 → shunt", "PAO₂ = 100; A–a = 48 → V/Q mismatch", "PAO₂ ≈ 56; A–a ≈ 4 (normal) → pure hypoventilation", "PAO₂ = 150; A–a = 98 → diffusion"], "a": [2], "w": ["A normal gradient excludes shunt.", "Forgot to use the patient’s PaCO₂.", "Correct (slide 66).", "Used PiO₂ instead of PAO₂."], "e": "PAO₂ = 150 − 75/0.8 = 150 − 93.75 ≈ 56; A–a = 56 − 52 ≈ 4. Treatment: open the airway, bag-mask ventilation, naloxone.", "tr": "", "m": "", "g": "patient1", "sl": "R66", "lec": "Respiratory Function", "sn": 66}, {"c": "r3", "s": "Level 4 · Expert", "l": 4, "t": "Calculation", "q": "Patient 2 (asthma): room air, PaCO₂ 32, PaO₂ 52 mmHg. A–a gradient?", "o": ["≈ 58 mmHg (PAO₂ = 150 − 32/0.8 = 110)", "≈ 4 mmHg", "≈ 98 mmHg", "≈ 20 mmHg"], "a": [0], "w": ["Correct (slide 66).", "That is patient 1.", "Used PiO₂.", "Arithmetic error."], "e": "High gradient → low V/Q (airways). Low PaCO₂ = hyperventilation; a rising PaCO₂ would signal fatigue.", "tr": "", "m": "", "g": "patient2", "sl": "R66", "lec": "Respiratory Function", "sn": 66}, {"c": "r3", "s": "Level 5 · Elite", "l": 5, "t": "Elite", "q": "Patients 2 and 3 have almost the same A–a gradient (58 vs 56). What best distinguishes the mechanism of Patient 3 (pneumonia)?", "o": ["His PaCO₂ is high.", "His A–a gradient is normal.", "His hypoxaemia improves little with O₂ (shunt), whereas Patient 2’s improves (low V/Q).", "He has a diffusion problem shown by the X-ray."], "a": [2], "w": ["PaCO₂ is 34 (low-normal).", "It is high.", "Correct (slides 38, 57, 66).", "Consolidation = alveoli filled = shunt."], "e": "The A–a gradient says “the lung is the problem”; the response to O₂ separates shunt (poor) from low V/Q (good). Patient 3: high-flow O₂, antibiotics, consider CPAP.", "tr": "The same SpO₂ — and even the same A–a — can hide different mechanisms.", "m": "", "g": "patient3", "sl": "R66", "lec": "Respiratory Function", "sn": 66}, {"c": "r3", "s": "Level 2 · Intermediate", "l": 2, "t": "Definition", "q": "Hypercapnia is defined as:", "o": ["PaO₂ < 60 mmHg", "PaCO₂ > 35 mmHg", "ETCO₂ < 35 mmHg", "PaCO₂ > 45 mmHg"], "a": [3], "w": ["Hypoxaemic respiratory failure.", "Normal range is 35–45.", "Hypocapnia.", "Correct (slide 59)."], "e": "PaCO₂ rises when alveolar ventilation is too low for the CO₂ produced. Acute hypercapnia → respiratory acidosis (↓ pH).", "tr": "", "m": "", "g": "hypercap", "sl": "R59", "lec": "Respiratory Function", "sn": 59}, {"c": "r3", "s": "Level 3 · Advanced", "l": 3, "t": "Classification", "q": "The three mechanisms of hypercapnia in the lecture are: (multiple answers)", "o": ["↑ CO₂ production when ventilation cannot increase", "↑ FiO₂ in a healthy person", "↑ Dead space", "↓ Minute ventilation (weak drive or weak pump)"], "a": [0, 2, 3], "w": ["Correct.", "Not a mechanism in a healthy person.", "Correct.", "Correct."], "e": "Weak drive: sedatives, opioids, brain injury; weak pump: neuromuscular/chest-wall disease, fatigue. Dead space: COPD, PE. CO₂ production: fever, sepsis, overfeeding.", "tr": "", "m": "", "g": "hypercapmech", "sl": "R59", "lec": "Respiratory Function", "sn": 59}, {"c": "r3", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "The key spirometric finding of an OBSTRUCTIVE disorder is:", "o": ["Normal spirometry with ↓ DLCO only", "↓ TLC with normal FEV₁/FVC", "↑ FEV₁/FVC with ↓ RV", "↓ FEV₁/FVC"], "a": [3], "w": ["Pure diffusion problem.", "Restrictive.", "Restrictive pattern.", "Correct (slide 60)."], "e": "Obstruction also gives ↑ RV and ↑ FRC (air trapping, hyperinflation).", "tr": "", "m": "", "g": "obstr", "sl": "R60", "lec": "Respiratory Function", "sn": 60}, {"c": "r3", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "A bronchodilator response suggesting reversibility (asthma) is an increase of:", "o": ["≥ 50 %", "≥ 5 % and ≥ 50 mL", "≥ 200 %", "≥ 12 % and ≥ 200 mL"], "a": [3], "w": ["No.", "Too small.", "No.", "Correct (slide 60)."], "e": "Asthma is reversible; COPD is largely irreversible.", "tr": "", "m": "", "g": "reversib", "sl": "R60", "lec": "Respiratory Function", "sn": 60}, {"c": "r3", "s": "Level 4 · Expert", "l": 4, "t": "Clinical", "q": "During a severe asthma attack, a PaCO₂ that rises from 32 to 44 mmHg means:", "o": ["A diffusion problem.", "Metabolic alkalosis.", "Fatigue — a danger sign requiring escalation.", "Improvement: PaCO₂ is now normal."], "a": [2], "w": ["CO₂ is spared in diffusion problems.", "No.", "Correct (slide 60).", "The patient should be hyperventilating."], "e": "Early asthma: hypoxaemia with ↑ A–a and LOW PaCO₂. A normal or rising PaCO₂ = exhaustion → NIV/intubation.", "tr": "“Normal” is not reassuring when it should be abnormal.", "m": "", "g": "fatigue", "sl": "R60", "lec": "Respiratory Function", "sn": 60}, {"c": "r3", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "The main finding of a RESTRICTIVE disorder is:", "o": ["Normal TLC with wheeze", "↓ TLC (with ↓ FVC and a normal or ↑ FEV₁/FVC)", "↓ FEV₁/FVC", "↑ RV and ↑ FRC"], "a": [1], "w": ["Obstruction.", "Correct (slide 62).", "Obstruction.", "Obstruction (air trapping)."], "e": "Parenchymal: fibrosis, ARDS, oedema (stiff lung, ↑ A–a). Extraparenchymal: pleura, chest wall, neuromuscular (hypoventilation, A–a normal at first).", "tr": "", "m": "", "g": "restr", "sl": "R62", "lec": "Respiratory Function", "sn": 62}, {"c": "r3", "s": "Level 3 · Advanced", "l": 3, "t": "Classification", "q": "Which restrictive disorder typically gives hypercapnia with a NORMAL A–a gradient at first?", "o": ["Pulmonary fibrosis", "Pulmonary oedema", "ARDS", "Neuromuscular disease (extraparenchymal)"], "a": [3], "w": ["Parenchymal → ↑ A–a.", "Parenchymal.", "Parenchymal → ↑ A–a.", "Correct (slide 62)."], "e": "Extraparenchymal restriction → the lungs are normal but the pump is weak → hypoventilation.", "tr": "", "m": "", "g": "restr", "sl": "R62", "lec": "Respiratory Function", "sn": 62}, {"c": "r3", "s": "Level 2 · Intermediate", "l": 2, "t": "Clinical", "q": "Stridor indicates obstruction of the:", "o": ["Upper airway", "Pleura", "Small peripheral airways", "Alveoli"], "a": [0], "w": ["Correct (slide 46).", "Pleural rub.", "Wheeze.", "Crackles."], below 160."], "e": "MAP = 40 + 40/3 ≈ 53; CPP = MAP − ICP ≈ 28 mmHg — far below 60 (autoregulation lost).", "tr": "", "m": "", "g": "x-cpp", "sl": "N19", "lec": "Neural Function", "sn": 19}, {"c": "x1", "s": "Level 4 · Expert", "l": 4, "t": "Integrated", "q": "An opioid overdose patient (RR 6/min) also has a brain contusion. Why is his hypoventilation particularly dangerous for the brain?", "o": ["↑ PaCO₂ dilates cerebral vessels → ↑ cerebral blood volume → ↑ ICP; plus hypoxaemia.", "Hypoventilation lowers PaCO₂ → cerebral vasoconstriction.", "Opioids increase CSF production.", "Hypoventilation raises MAP and CPP."], "a": [0], "w": ["Correct (Ch 1 slide 41 + Ch 3).", "Hypoventilation RAISES PaCO₂.", "Not in the lectures.", "Not the main issue."], "e": "Monro–Kellie: more blood volume → ICP ↑ → CPP ↓. Ventilate and give naloxone.", "tr": "", "m": "", "g": "x-co2", "sl": "R44", "lec": "Respiratory Function", "sn": 44}, {"c": "x1", "s": "Level 3 · Advanced", "l": 3, "t": "Integrated", "q": "Which situation causes TISSUE hypoxia with NORMAL lungs (normal PaO₂)? (multiple answers)", "o": ["Carbon monoxide poisoning", "Pneumonia with consolidation", "Severe anaemia", "Hypovolaemic shock from severe dehydration"], "a": [0, 2, 3], "w": ["Hb blocked.", "Shunt → ↓ PaO₂ (lung problem).", "↓ CaO₂.", "↓ CO → ↓ DO₂ (Hb and lungs normal)."], "e": "DO₂ = CO × (1.34 × Hb × SaO₂ + 0.003 × PaO₂): the blood and the heart matter as much as the lungs.", "tr": "", "m": "", "g": "x-do2", "sl": "R42", "lec": "Respiratory Function", "sn": 42}, {"c": "x1", "s": "Level 4 · Expert", "l": 4, "t": "Integrated", "q": "A patient in septic shock breathes at 30/min with a PaCO₂ of 28 mmHg. The best explanation is:", "o": ["Pure anxiety unrelated to shock", "Opioid-induced respiratory depression", "Obstructive lung disease", "Respiratory compensation of the lactic (metabolic) acidosis of shock via chemoreceptors"], "a": [3], "w": ["Ignores the lactate.", "Would give low RR and high PaCO₂.", "Would tend to raise PaCO₂ late.", "Correct (Ch 2 slide 22 + Ch 3 slide 44)."], "e": "Hypoperfusion → anaerobic metabolism → lactate → ↓ pH → chemoreceptors → ↑ ventilation → ↓ PaCO₂ (same mechanism as Kussmaul).", "tr": "", "m": "", "g": "x-tachyp", "sl": "C22", "lec": "Cardio-vascular Function", "sn": 22}, {"c": "x1", "s": "Level 4 · Expert", "l": 4, "t": "Integrated", "q": "Tension pneumothorax causes shock mainly because:", "o": ["It causes cardiogenic shock by myocardial infarction.", "The collapsed lung releases vasodilators.", "↑ intrathoracic pressure compresses the veins and the heart → ↓ venous return → ↓ CO (obstructive shock).", "It is a distributive shock with low SVR."], "a": [2], "w": ["No.", "No.", "Correct (Ch 2 slide 38).", "It is obstructive."], "e": "Respiratory AND circulatory emergency. Treatment = needle decompression / chest drain (remove the obstacle).", "tr": "", "m": "", "g": "x-ptx", "sl": "C38", "lec": "Cardio-vascular Function", "sn": 38}, {"c": "x1", "s": "Level 5 · Elite", "l": 5, "t": "Elite", "q": "Massive pulmonary embolism. Which combination is correct?", "o": ["Obstructive shock (RV afterload ↑↑, CVP ↑); dead space (V/Q = ∞) with ↑ PaCO₂–ETCO₂ gap", "Distributive shock; V/Q = 0", "Cardiogenic shock; low CVP", "Hypovolaemic shock; normal ETCO₂"], "a": [0], "w": ["Correct (Ch 2 slide 38 + Ch 3 slide 38).", "PE is obstructive; dead space is V/Q = ∞.", "CVP is high; the pump is overloaded by an obstacle.", "No."], "e": "Treatment of the cause: thrombolysis/anticoagulation. Hypoxaemia with a clear chest X-ray → think PE.", "tr": "", "m": "", "g": "x-pe", "sl": "C33", "lec": "Cardio-vascular Function", "sn": 33}, {"c": "x1", "s": "Level 5 · Elite", "l": 5, "t": "Elite", "q": "Which pair of vital-sign patterns would you expect in (1) raised ICP with brainstem compression and (2) haemorrhagic shock?", "o": ["(1) hypotension + tachycardia; (2) hypertension + bradycardia", "Both: hypotension + bradycardia", "Both: hypertension + tachycardia", "(1) hypertension + bradycardia + irregular breathing; (2) hypotension (late) + tachycardia + tachypnoea"], "a": [3], "w": ["Inverted.", "No.", "No.", "Correct (Ch 1 slide 37 + Ch 2 slide 22)."], "e": "Cushing triad vs shock signs — mirror images. A head-injured patient who is hypotensive and tachycardic is bleeding somewhere until proven otherwise.", "tr": "", "m": "", "g": "x-cushingshock", "sl": "N37", "lec": "Neural Function", "sn": 37}, {"c": "x1", "s": "Level 3 · Advanced", "l": 3, "t": "Integrated", "q": "The universal first steps in an acutely ill patient (any of the three lectures) are:", "o": ["Treat the SpO₂ number with 100 % O₂ in all patients", "ABC: open airway, O₂ to target, circulatory support with IV access, then continuous monitoring and treatment of the cause", "Wait for blood results before giving O₂", "Imaging before stabilisation"], "a": [1], "w": ["Targets: 92–96 % (88–92 % in COPD).", "Correct.", "O₂ to target immediately.", "Stabilise first."], "e": "The same logic in all three lectures: support the failing function, then treat the mechanism.", "tr": "", "m": "", "g": "x-abc", "sl": "R64", "lec": "Respiratory Function", "sn": 64}, {"c": "e1", "s": "Level 3 · Advanced", "l": 3, "t": "Past exam", "q": "In the case of rising intracranial pressure, which of the following is correct: <span class=\"exsrc\">EM Jan 2023 Q1</span>", "o": ["CSF and venous blood supply can change their volume", "Pressure volume relationship is linear", "Cerebral perfusion pressure increases", "Ischemia is a result if the compensatory mechanisms are overwhelmed", "Papilledema on ophthalmoscopy"], "a": [0, 3, 4], "w": ["True: CSF and venous blood have the greatest ability to change volume to compensate (slide 24).", "False: the curve is flat then nearly exponential (slide 24).", "False: CPP = MAP − ICP, so CPP falls when ICP rises.", "True: once compensation is overwhelmed, ICP rises steeply → ischaemia (slides 24, 28).", "True: papilloedema is an eye sign of raised ICP (slide 37)."], "e": "Buffers (CSF, venous blood) keep ICP normal at first; when they are used up ICP rises exponentially, CPP falls and the brain becomes ischaemic.", "tr": "CPP never rises with ICP.", "m": "Fixed box: buffers first, then the knee, then the cliff.", "g": "", "sl": "N24", "lec": "Neural Function", "sn": 24}, {"c": "e1", "s": "Level 3 · Advanced", "l": 3, "t": "Past exam", "q": "Describe the mechanisms of cerebral edema: <span class=\"exsrc\">EM Jan 2023 Q2</span>", "o": ["Vasogenic edema arises from permanent damage to brain tissue", "Interstitial edema results from the bulk flow of cerebrospinal fluid across the ependyma", "Osmotic edema arises from a mismatch in osmolarity between the brain parenchyma and circulating blood", "Vasogenic edema results in disruption of the endothelial tight junctions", "Hepatic failure can lead to cytotoxic edema"], "a": [1, 2, 3, 4], "w": ["False: “temporary or permanent damage” describes CYTOTOXIC oedema (slide 30).", "True: transependymal flow in hydrocephalus (slide 31).", "True: hypo-osmotic plasma → water enters the brain (slide 33).", "True: leaky BBB with broken tight junctions (slide 29).", "True: slide 30 lists hepatic failure among cytotoxic causes."], "e": "Vasogenic = vessel (tight junctions), cytotoxic = cell (energy failure; stroke, hepatic failure), interstitial = CSF across the ependyma, osmotic = osmolarity gap.", "tr": "Don’t attach “permanent damage” to vasogenic oedema.", "m": "VCIO: Vessel · Cell · Inner lining · Osmolality.", "g": "", "sl": "N29", "lec": "Neural Function", "sn": 29}, {"c": "e1", "s": "Level 2 · Intermediate", "l": 2, "t": "Past exam", "q": "To monitor ICP, which of the following techniques is useful: <span class=\"exsrc\">EM Jan 2023 Q3</span>", "o": ["Transcranial doppler", "Mean arterial pressure in the carotid artery", "Ventriculostomy drain", "Extraventricular drain", "Ultrasound optic nerve sheath diameter"], "a": [0, 2, 3, 4], "w": ["True: non-invasive technique (slide 22).", "F function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// frequency of each chapter in past exams (question counts, see analysis)
const FREQ=Object.fromEntries(CH.map(c=>[c.id,Q.filter(q=>q.c===c.id).length]));
function plan(ids,n){ // returns {id:count}
 const avail=Object.fromEntries(ids.map(id=>[id,exQ(id).length]));
 const parts={};ids.forEach(id=>(parts[part(id)]=parts[part(id)]||[]).push(id));
 const w={};Object.values(parts).forEach(pids=>{const share=pids.length/ids.length;const tot=pids.reduce((s,id)=>s+(EX.mode==="real"?FREQ[id]:1),0);pids.forEach(id=>w[id]=share*(EX.mode==="real"?FREQ[id]:1)/tot)});
 const cnt=Object.fromEntries(ids.map(id=>[id,0]));let left=Math.min(n,ids.reduce((s,id)=>s+avail[id],0));
 while(left>0){ // give next question to the chapter furthest below its target, among those with questions left
  const open=ids.filter(id=>cnt[id]<avail[id]);if(!open.length)break;
  const tw=open.reduce((s,id)=>s+w[id],0);const placed=ids.reduce((s,id)=>s+cnt[id],0)+1;
  let best=open[0],bd=-1e9;open.forEach(id=>{const d=placed*w[id]/tw-cnt[id];if(d>bd){bd=d;best=id}});cnt[best]++;left--}
 return cnt}

const DAY=864e5,IV=[0,1,3,7,14];
function srs(id,p){const s=state[id];s.hist=(s.hist||[]).concat([[Date.now(),p,(s.sel||[]).slice()]]).slice(-10);
 if(p===1){s.bx=Math.min((s.bx||0)+1,4)}else{s.bx=0;s.miss=(s.miss||0)+1}s.due=Date.now()+IV[s.bx]*DAY-(p===1?0:1)}
function dueList(){const now=Date.now();return Q.filter(q=>{const s=state[q.id];return s&&s.due!=null&&s.due<=now&&(s.bx||0)<4})}
function mistList(){return Q.filter(q=>{const s=state[q.id];return s&&s.miss})}
function twins(q){return q.g?Q.filter(x=>x.g===q.g&&x.id!==q.id):[]}
function goTwin(id){const q=Q[id];const t=twins(q);if(!t.length)return;const fresh=t.filter(x=>!(state[x.id]&&state[x.id].done));const n=(fresh.length?fresh:t)[0];
 if(state[n.id]&&state[n.id].done)undo(n.id);
 if((location.hash.slice(1)||"home")!==n.c)go(n.c);else render(n.c);setTimeout(()=>{const el=document.getElementById("q"+n.id);if(el){el.scrollIntoView({behavior:"smooth",block:"start"});el.style.outline="3px solid #e0a419";setTimeout(()=>el.style.outline="",2500)}},60)}
