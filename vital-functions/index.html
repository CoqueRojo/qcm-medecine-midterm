<style>

<script>const Q = [{"c": "v1", "s": "Level 1 · Basic", "l": 1, "t": "Definition", "q": "In a healthy adult, the normal intracranial pressure (ICP) is:", "o": ["20–25 mmHg", "5–15 mmHg", "60–160 mmHg", "0–5 mmHg"], "a": [1], "w": ["This is already raised ICP (≥ 20 mmHg).", "Correct: normal ICP ranges from 5 to 15 mmHg in healthy adults (slide 7).", "This is the autoregulation range of CPP, not ICP.", "Too low; this is below the normal range given in the lecture."], "e": "The cranial vault is a rigid box containing brain, CSF and blood; at rest the pressure inside is 5–15 mmHg. Values ≥ 20 mmHg define intracranial hypertension.", "tr": "Don’t mix the three ranges: ICP 5–15, raised ICP ≥ 20, autoregulation of CPP 60–160 mmHg.", "m": "“5–15 normal, 20 is trouble.”", "g": "icpnorm", "sl": "N7", "lec": "Neural Function", "sn": 7}, {"c": "v1", "s": "Level 1 · Basic", "l": 1, "t": "Definition", "q": "According to the lecture’s take-home message, increased ICP is defined as a pressure:", "o": ["≥ 60 mmHg", "≥ 20 mmHg", "≥ 10 mmHg", "≥ 15 mmHg"], "a": [1], "w": ["60 mmHg is the lower limit of CPP autoregulation.", "Correct (slide 49).", "Still within the normal range (5–15).", "15 is the upper limit of normal, not the definition of raised ICP."], "e": "Raised ICP = ≥ 20 mmHg. It matters because it lowers CPP (CPP = MAP − ICP) and can lead to herniation.", "tr": "The slide writes “≥ 20 mm” — the unit is mmHg.", "m": "", "g": "icpnorm", "sl": "N49", "lec": "Neural Function", "sn": 49}, {"c": "v1", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Which intracranial component occupies the LARGEST volume in a healthy adult?", "o": ["Blood", "Extracellular fluid", "Brain parenchyma (glia + neurons)", "Cerebrospinal fluid"], "a": [2], "w": ["Blood is only 100–150 mL.", "ECF is < 75 mL.", "Correct: glia 700–900 mL + neurons 500–700 mL ≈ 87 % of the content.", "CSF is only 100–150 mL."], "e": "Slide 8: glia 700–900 mL, neurons 500–700 mL, blood 100–150 mL, CSF 100–150 mL, ECF < 75 mL. The small mobile fractions (blood, CSF) are the buffers when volume is added.", "tr": "The biggest compartment (brain) is the one that can be displaced the LEAST; the small ones (CSF, venous blood) buffer pressure.", "m": "", "g": "contents", "sl": "N8", "lec": "Neural Function", "sn": 8}, {"c": "v1", "s": "Level 2 · Intermediate", "l": 2, "t": "Mechanism", "q": "Which intracranial components have the GREATEST ability to change their volume to compensate for a rise in pressure?", "o": ["CSF and venous blood", "Arterial blood and extracellular fluid", "Neurons and glia", "The dura mater and the skull"], "a": [0], "w": ["Correct (slide 24): they are displaced out of the skull (spinal subarachnoid space, jugular veins).", "Arterial volume is protected to keep perfusion; ECF is tiny.", "Brain tissue is barely compressible.", "The skull is rigid — that is the whole point of Monro–Kellie."], "e": "When a mass appears, CSF shifts into the spinal subarachnoid space and venous blood is squeezed out. While these buffers last, ICP stays normal (compensated state).", "tr": "", "m": "", "g": "buffers", "sl": "N24", "lec": "Neural Function", "sn": 24}, {"c": "v1", "s": "Level 2 · Intermediate", "l": 2, "t": "Definition", "q": "Which statement is the Monro–Kellie doctrine?", "o": ["The cranium is a fixed-volume space containing brain, blood and CSF, so an increase in one must be compensated by a decrease in another or ICP rises.", "CSF production always equals CSF absorption, so ICP cannot change.", "The skull expands when intracranial volume rises.", "ICP is proportional to mean arterial pressure."], "a": [0], "w": ["Correct (slides 17–18).", "ICP can rise when production exceeds absorption (hydrocephalus).", "In adults the skull is rigid; only infants (open fontanelles) have some expansion.", "That describes nothing in the doctrine; CPP = MAP − ICP is a different relationship."], "e": "ΔV brain + ΔV blood + ΔV CSF + ΔV mass = 0. The only way to lower ICP is to decrease the volume of brain, blood or CSF — every ICP treatment works on this principle.", "tr": "", "m": "“Fixed box, three tenants: if one grows, another must move out.”", "g": "monro", "sl": "N17", "lec": "Neural Function", "sn": 17}, {"c": "v1", "s": "Level 3 · Advanced", "l": 3, "t": "Application", "q": "A tumour adds 40 mL inside the skull of an adult. ICP stays at 12 mmHg. According to Monro–Kellie, this is most likely because:", "o": ["About 40 mL of CSF and venous blood have left the cranial cavity.", "ICP measurement is wrong: any added volume raises ICP immediately.", "Arterial inflow has increased by 40 mL.", "The brain has been compressed by 40 mL."], "a": [0], "w": ["Correct: ΔV mass + ΔV CSF + ΔV blood = 0 — compensated state.", "Small volumes are buffered; ICP rises only when buffers are exhausted.", "That would add volume, not remove it.", "Brain tissue is the least compressible component."], "e": "Compensated state (slide 18): the mass is paid for by displaced CSF and venous blood. Once these buffers (≈ 75 mL each on the slide) are exhausted, ICP rises steeply.", "tr": "A normal ICP does not mean there is no mass — it may mean compensation is still working.", "m": "", "g": "monro", "sl": "N18", "lec": "Neural Function", "sn": 18}, {"c": "v1", "s": "Level 2 · Intermediate", "l": 2, "t": "Mechanism", "q": "Concerning cerebrospinal fluid, which statement is correct?", "o": ["It is made in the choroid plexus of the lateral ventricles and reabsorbed into the dural venous sinuses.", "It flows from the 4th ventricle to the 3rd ventricle through the interventricular foramen.", "It is mainly produced by the arachnoid granulations.", "An adult produces about 50 mL per day."], "a": [0], "w": ["Correct (slide 13).", "Wrong direction and wrong foramen: lateral → (foramen of Monro) → 3rd → (aqueduct) → 4th.", "Arachnoid granulations REABSORB CSF.", "Adults make and resorb ≈ 500 mL/day."], "e": "CSF: made in the lateral ventricles (choroid plexus) → foramen of Monro → 3rd ventricle → aqueduct of Sylvius → 4th ventricle → foramina of Luschka and Magendie → subarachnoid space → arachnoid granulations → dural venous sinuses. ≈ 500 mL/day.", "tr": "", "m": "“Made in the Lateral, Leaves by the Granulations.”", "g": "csf", "sl": "N13", "lec": "Neural Function", "sn": 13}, {"c": "v1", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Approximately how much CSF does an adult produce and reabsorb per day?", "o": ["150 mL", "1500 mL", "50 mL", "500 mL"], "a": [3], "w": ["That is roughly the total CSF VOLUME at one time, not daily production.", "Too high.", "Ten times too low.", "Correct (slide 13)."], "e": "Total volume ≈ 100–150 mL, daily production ≈ 500 mL — CSF is renewed several times a day. That is why blocking absorption (hydrocephalus) raises ICP quickly.", "tr": "Volume (≈ 150 mL) ≠ daily production (≈ 500 mL).", "m": "", "g": "csf", "sl": "N13", "lec": "Neural Function", "sn": 13}, {"c": "v1", "s": "Level 2 · Intermediate", "l": 2, "t": "Mechanism", "q": "Which of the following are functions of the blood–brain barrier? (multiple answers)", "o": ["Making brain ECF glucose vary exactly like blood glucose", "Modulating the entry of metabolic substrates such as glucose", "Controlling ion movements: Na⁺/K⁺-ATPase pumps Na⁺ into the CSF and K⁺ out of it", "Preventing access of toxins and peripheral neurotransmitters to the CNS", "Producing most of the CSF"], "a": [1, 2, 3], "w": ["The opposite: brain ECF glucose is MORE STABLE than blood glucose.", "Correct (slide 14).", "Correct (slide 14).", "Correct (slide 14).", "CSF is produced by the choroid plexus."], "e": "The BBB lets the brain regulate its microenvironment separately from the systemic circulation. Its dysfunction is central to vasogenic oedema, a major cause of raised ICP.", "tr": "Watch the direction of the pump: Na⁺ INTO the CSF, K⁺ OUT of the CSF into the blood.", "m": "", "g": "bbb", "sl": "N14", "lec": "Neural Function", "sn": 14}, {"c": "v1", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "BBB dysfunction is an essential component in the pathophysiology of which type of cerebral oedema?", "o": ["Interstitial oedema", "Vasogenic oedema", "Osmotic oedema", "Cytotoxic oedema"], "a": [1], "w": ["Interstitial oedema is due to transependymal CSF flow (hydrocephalus).", "Correct: abnormal BBB permeability → plasma ultrafiltrate leaks into the interstitium.", "Osmotic oedema is due to an osmolality gradient between plasma and brain.", "Cytotoxic oedema is due to energy failure of the Na⁺/K⁺ pump inside cells."], "e": "Vasogenic oedema: disruption of endothelial tight junctions and astrocyte–endothelium relationship → fluid and solutes leave the vessels.", "tr": "", "m": "", "g": "bbb", "sl": "N15", "lec": "Neural Function", "sn": 15}, {"c": "v1", "s": "Level 1 · Basic", "l": 1, "t": "Concept", "q": "Which of the following can TRANSIENTLY raise ICP in a normal person? (multiple answers)", "o": ["Movement or change of position", "Taking acetazolamide", "Pain or fever", "Coughing or straining"], "a": [0, 2, 3], "w": ["Correct (slide 16).", "Acetazolamide decreases CSF production — it LOWERS ICP.", "Correct (slide 16).", "Correct (slide 16)."], "e": "Slide 16: normal ICP can transiently increase with movement, position, pain, fever, coughing, straining. Sustained elevation is what matters clinically.", "tr": "", "m": "", "g": "transient", "sl": "N16", "lec": "Neural Function", "sn": 16}, {"c": "v1", "s": "Level 1 · Basic", "l": 1, "t": "Equation", "q": "Cerebral perfusion pressure is calculated as:", "o": ["CPP = ICP − MAP", "CPP = SBP − DBP", "CPP = MAP − ICP", "CPP = MAP × ICP"], "a": [2], "w": ["Inverted: this would give a negative number.", "That is the pulse pressure.", "Correct (slide 19).", "Pressures are subtracted, not multiplied."], "e": "The driving pressure for blood into the brain is the arterial pressure minus the pressure opposing it inside the skull (ICP).", "tr": "", "m": "“The brain is perfused by what’s left of MAP after ICP takes its share.”", "g": "cpp", "sl": "N19", "lec": "Neural Function", "sn": 19}, {"c": "v1", "s": "Level 3 · Advanced", "l": 3, "t": "Calculation", "q": "A patient has BP 120/80 mmHg and ICP 35 mmHg. His CPP is approximately:", "o": ["45 mmHg", "73 mmHg", "58 mmHg", "85 mmHg"], "a": [2], "w": ["Uses DBP instead of MAP (80 − 35).", "Would need a MAP of ≈ 108 mmHg; here MAP = 80 + 40/3 ≈ 93.", "Correct: MAP = 80 + ⅓(40) ≈ 93; CPP = 93 − 35 ≈ 58 mmHg.", "That would be CPP with ICP ≈ 8."], "e": "MAP = DBP + ⅓(SBP − DBP) = 80 + 13 = 93 mmHg. CPP = 93 − 35 = 58 mmHg — just below 60, the lower limit of autoregulation: risk of ischaemia.", "tr": "Don’t use systolic or diastolic pressure directly; compute MAP first.", "m": "", "g": "cpp", "sl": "N21", "lec": "Neural Function", "sn": 21}, {"c": "v1", "s": "Level 4 · Expert", "l": 4, "t": "Calculation", "q": "Three patients: (1) BP 120/80, ICP 10; (2) BP 120/80, ICP 35; (3) BP 90/50, ICP 35. Which one is “infarcting his brain right now”?", "o": ["Patient 3", "None: all have CPP > 60 mmHg", "Patient 2", "Patient 1"], "a": [0], "w": ["Correct: MAP = 50 + 40/3 ≈ 63; CPP = 63 − 35 ≈ 28 mmHg — far below 60.", "Patients 2 and 3 are below 60.", "CPP ≈ 58 mmHg: at the edge of autoregulation, but much better than patient 3.", "CPP ≈ 83 mmHg: normal."], "e": "High ICP + hypotension = double hit. The same ICP (35) gives CPP 58 with a normal BP but only 28 with hypotension.", "tr": "Treating hypotension is a brain treatment: CPP depends on MAP as much as on ICP.", "m": "", "g": "cpp", "sl": "N21", "lec": "Neural Function", "sn": 21}, {"c": "v1", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Cerebral autoregulation keeps cerebral blood flow constant for CPP values typically between:", "o": ["20 and 60 mmHg", "60 and 160 mmHg", "5 and 15 mmHg", "100 and 200 mmHg"], "a": [1], "w": ["Below 60 is the ischaemic zone.", "Correct (slide 20).", "That is normal ICP.", "Above 160 is hypertensive encephalopathy."], "e": "Within 60–160 mmHg, cerebral arterioles dilate when pressure falls and constrict when it rises, so CBF stays constant (≈ 50 mL/100 g/min). Outside, CBF is linearly related to CPP.", "tr": "The lecture gives 60–160 mmHg; some textbooks write 50–150 — answer with the lecture’s numbers.", "m": "", "g": "autoreg", "sl": "N20", "lec": "Neural Function", "sn": 20}, {"c": "v1", "s": "Level 3 · Advanced", "l": 3, "t": "Cause-effect", "q": "A patient’s CPP falls to 45 mmHg. What happens?", "o": ["Cerebral arterioles constrict maximally.", "CBF stays constant because of autoregulation.", "Hypertensive encephalopathy develops.", "CBF falls linearly with CPP, with a risk of cerebral ischaemia."], "a": [3], "w": ["At the lower limit they are maximally DILATED.", "45 mmHg is outside the autoregulatory range.", "That is the risk ABOVE 160 mmHg.", "Correct: below 60 mmHg, flow becomes pressure-passive."], "e": "Below the lower limit, arterioles are already maximally dilated and can do nothing more: CBF follows CPP downward → ischaemia.", "tr": "", "m": "", "g": "autoreg", "sl": "N20", "lec": "Neural Function", "sn": 20}, {"c": "v1", "s": "Level 2 · Intermediate", "l": 2, "t": "Definition", "q": "Cerebral blood flow is expressed in:", "o": ["mL·100 g⁻¹·min⁻¹", "mL/kg/h", "L/min", "mmHg"], "a": [0], "w": ["Correct (slide 19): volume per unit mass per unit time.", "That is the unit used for urine output.", "That is the unit of cardiac output (a total flow, not per mass).", "That is a pressure unit (MAP, ICP, CPP)."], "e": "CBF = blood volume flowing per unit mass per unit time in brain tissue. Normal ≈ 50 mL/100 g/min on the lecture graphs.", "tr": "", "m": "", "g": "cbf", "sl": "N19", "lec": "Neural Function", "sn": 19}, {"c": "v1", "s": "Level 3 · Advanced", "l": 3, "t": "Graph", "q": "On the graph of factors affecting CBF (slide 41), which variable has a near-linear relationship with CBF over the physiological range, with CBF rising as the variable rises?", "o": ["PaCO₂", "ICP", "PaO₂", "MAP"], "a": [0], "w": ["Correct: ↑ PaCO₂ → cerebral vasodilation → ↑ CBF.", "CBF falls as ICP rises.", "CBF is flat over the normal PaO₂ range; it rises only when PaO₂ falls below ≈ 50–60 mmHg.", "MAP shows a plateau (autoregulation) between its limits."], "e": "CO₂ is a powerful cerebral vasodilator. This is why hypoventilation raises ICP, and why short hyperventilation (↓ PaCO₂ → vasoconstriction → ↓ cerebral blood volume) lowers it.", "tr": "", "m": "“CO₂ opens the brain’s taps.”", "g": "co2cbf", "sl": "N41", "lec": "Neural Function", "sn": 41}, {"c": "v1", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Which statement about the brain’s blood supply is given in the lecture?", "o": ["The brain uses fatty acids as its main fuel.", "The brain stores enough glycogen to survive 30 minutes without flow.", "The brain is only 2–3 % of body mass but needs about 20 % of the circulation.", "The brain is 20 % of body mass and receives 2–3 % of the circulation."], "a": [2], "w": ["The BBB slide stresses glucose as the main neuronal fuel.", "Not in the lecture, and false: the brain has almost no energy stores.", "Correct (slide 19).", "Inverted numbers."], "e": "Small mass, huge energy need, no stores → the brain depends on continuous perfusion; CPP must be protected.", "tr": "The slide says “20 % of circulating blood volume”; the usual physiological formulation is ≈ 15–20 % of cardiac output.", "m": "", "g": "brainneeds", "sl": "N19", "lec": "Neural Function", "sn": 19}, {"c": "v1", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Which of the following are NON-invasive methods to assess ICP listed in the lecture? (multiple answers)", "o": ["External ventricular drain (ventriculostomy)", "Ultrasound of the optic nerve sheath diameter", "Transcranial Doppler", "Intraparenchymal monitor"], "a": [1, 2], "w": ["Invasive (slide 22).", "Correct.", "Correct.", "Invasive."], "e": "Invasive: ventriculostomy drain, intraparenchymal monitor, telemetric monitoring, multimodality probe. Non-invasive: optic nerve sheath diameter (ONSD) ultrasound, transcranial Doppler.", "tr": "", "m": "", "g": "monitoring", "sl": "N22", "lec": "Neural Function", "sn": 22}, {"c": "v1", "s": "Level 3 · Advanced", "l": 3, "t": "Graph", "q": "On a normal ICP waveform, the small-amplitude, rapid pulsations are caused by:", "o": ["The cardiac cycle (fluctuation of MAP with heart rate)", "Coughing", "CSF production", "Respiration"], "a": [0], "w": ["Correct (slide 23).", "Coughing causes transient peaks, not the regular small pulsations.", "CSF production is continuous, not pulsatile.", "Respiration causes LARGER-amplitude, LOWER-frequency fluctuations."], "e": "ICP = baseline level + pulsatile components. Heart rate → small rapid pulses; breathing → larger, slower waves. ICP is fully described only by both the baseline and the pulsatile components.", "tr": "Inverting cardiac and respiratory components is the classic trap.", "m": "", "g": "waveform", "sl": "N23", "lec": "Neural Function", "sn": 23}, {"c": "v1", "s": "Level 4 · Expert", "l": 4, "t": "Integrated", "q": "Short-term hyperventilation lowers ICP because:", "o": ["It increases cerebral blood flow and washes out oedema.", "It increases CSF absorption.", "It raises PaO₂, which constricts cerebral vessels.", "Low PaCO₂ causes cerebral vasoconstriction, decreasing cerebral blood volume."], "a": [3], "w": ["The slide’s wording, but physiologically inverted: low PaCO₂ DECREASES CBF.", "Ventilation does not act on CSF.", "PaO₂ has little effect on CBF in the normal range.", "Correct (consistent with slide 41)."], "e": "Monro–Kellie target = blood volume. ↓ PaCO₂ → vasoconstriction → ↓ CBF and ↓ cerebral blood volume → ↓ ICP. Used briefly, because excessive vasoconstriction can itself cause ischaemia.", "tr": "Note on the source: slide 40 writes “increases cerebral blood flow” — this contradicts slide 41. The physiology: hyperventilation DEcreases CBF.", "m": "", "g": "hypervent", "sl": "N40", "lec": "Neural Function", "sn": 40}, {"c": "v2", "s": "Level 2 · Intermediate", "l": 2, "t": "Graph", "q": "On the intracranial pressure–volume curve, the first, flat part of the curve corresponds to:", "o": ["Decompensation: ICP rises exponentially.", "Loss of autoregulation of CBF.", "Brain herniation.", "Compensation: added volume is buffered by CSF and venous blood, so ICP barely rises."], "a": [3], "w": ["That is the steep final part.", "Autoregulation is a different curve (CBF vs CPP).", "Herniation occurs on the steep part.", "Correct (slides 24–25)."], "e": "High compliance at first (flat), then the curve bends and becomes steep: when buffers are exhausted, a few mL produce a near-exponential rise in ICP.", "tr": "", "m": "", "g": "pv", "sl": "N24", "lec": "Neural Function", "sn": 24}, {"c": "v2", "s": "Level 4 · Expert", "l": 4, "t": "Graph", "q": "Two patients have the same ICP of 14 mmHg. Patient X is on the flat part of the pressure–volume curve; patient Y is at the “knee”. A small additional volume (e.g. a little more bleeding) is added to each. What happens?", "o": ["Y’s ICP rises much more than X’s.", "Neither rises: ICP is normal in both.", "Both ICPs rise by the same amount.", "X’s ICP rises more than Y’s."], "a": [0], "w": ["Correct: at the knee, compliance is low, so the same ΔV gives a large ΔP.", "A normal ICP says nothing about the remaining reserve.", "The slope (compliance) is different at the two points.", "X is on the flat part — very compliant."], "e": "The ICP value alone does not show the reserve. Near the knee, compensation is exhausted, so any extra volume (bleeding, oedema, hypercapnia) makes ICP shoot up.", "tr": "“Normal ICP = safe” is the trap.", "m": "", "g": "pv", "sl": "N25", "lec": "Neural Function", "sn": 25}, {"c": "v2", "s": "Level 2 · Intermediate", "l": 2, "t": "Cause-effect", "q": "The two main consequences of elevated ICP listed in the lecture are:", "o": ["Hydrocephalus and meningitis", "Hypertension and tachycardia", "Cerebral ischaemia (↓ CPP) and cerebral herniation", "Hyperglycaemia and fever"], "a": [2], "w": ["These are causes, not consequences.", "The Cushing triad is hypertension and BRADYCARDIA.", "Correct (slide 26).", "Not consequences of raised ICP in the lecture."], "e": "↑ ICP → ↓ CPP (= MAP − ICP) → ischaemia; and pressure gradients push brain tissue through openings → herniation.", "tr": "", "m": "", "g": "effects", "sl": "N26", "lec": "Neural Function", "sn": 26}, {"c": "v2", "s": "Level 2 · Intermediate", "l": 2, "t": "Definition", "q": "Vasogenic cerebral oedema:", "o": ["Results from an abnormally permeable BBB, with plasma ultrafiltrate accumulating in the interstitial spaces.", "Is typically caused by too-rapid correction of hypernatraemia.", "Is caused by failure of the Na⁺/K⁺ pump inside brain cells.", "Is caused by bulk flow of CSF across the ependyma."], "a": [0], "w": ["Correct (slide 29).", "That causes osmotic oedema.", "That is cytotoxic oedema.", "That is interstitial oedema."], "e": "Disrupted tight junctions + altered astrocyte–endothelium relationship → fluid and solutes extravasate → extracellular oedema. Causes: neoplasms, brain injury, infection, inflammation. Responds to steroids.", "tr": "", "m": "", "g": "vasogenic", "sl": "N29", "lec": "Neural Function", "sn": 29}, {"c": "v2", "s": "Level 3 · Advanced", "l": 3, "t": "Mechanism", "q": "In cytotoxic oedema, water enters brain cells because:", "o": ["CSF crosses the ependymal lining.", "Plasma becomes hypo-osmotic compared with the brain.", "Energy failure stops the Na⁺/K⁺ pump, Na⁺ accumulates inside cells and water follows osmotically.", "The BBB tight junctions are disrupted."], "a": [2], "w": ["That is interstitial oedema.", "That is osmotic oedema.", "Correct (slide 30).", "That is vasogenic oedema."], "e": "Cytotoxic oedema = cell swelling. Causes: ischaemia, trauma, intracerebral haemorrhage; also hepatic failure, toxins, Reye syndrome, water intoxication.", "tr": "", "m": "Cytotoxic = Cell (Inside); Vasogenic = Vessel leak (Outside).", "g": "cytotoxic", "sl": "N30", "lec": "Neural Function", "sn": 30}, {"c": "v2", "s": "Level 2 · Intermediate", "l": 2, "t": "Classification", "q": "Match: which cause is typical of CYTOTOXIC (rather than vasogenic) oedema?", "o": ["Brain abscess / infection", "Inflammation", "Brain tumour", "Cerebral ischaemia (stroke)"], "a": [3], "w": ["Infection is listed under vasogenic oedema.", "Listed under vasogenic.", "Neoplastic processes cause vasogenic oedema.", "Correct: ischaemia → energy failure → pump failure."], "e": "Vasogenic: tumours, brain injury, infection, inflammation. Cytotoxic: ischaemia, trauma, intracerebral haemorrhage, hepatic failure, toxins, Reye syndrome, water intoxication. (Brain injury/trauma appears in both lists.)", "tr": "", "m": "", "g": "edemacause", "sl": "N29", "lec": "Neural Function", "sn": 29}, {"c": "v2", "s": "Level 2 · Intermediate", "l": 2, "t": "Definition", "q": "Interstitial cerebral oedema results from:", "o": ["Hypo-osmotic plasma", "Na⁺/K⁺ pump failure", "Bulk flow of CSF across the ependymal lining of the ventricles (transependymal flow)", "Leaky BBB"], "a": [2], "w": ["Osmotic.", "Cytotoxic.", "Correct (slide 31).", "Vasogenic."], "e": "Seen in hydrocephalic conditions: obstructive, communicating and normal-pressure hydrocephalus. CSF under pressure is forced into the periventricular white matter.", "tr": "", "m": "", "g": "interstitial", "sl": "N31", "lec": "Neural Function", "sn": 31}, {"c": "v2", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "A patient with severe hypernatraemia is corrected very quickly with hypotonic fluids and becomes confused. The type of cerebral oedema is:", "o": ["Vasogenic", "Cytotoxic", "Interstitial", "Osmotic"], "a": [3], "w": ["No BBB damage is described.", "No energy failure is described.", "No hydrocephalus.", "Correct: plasma becomes relatively hypo-osmotic, water moves into the comparatively hyperosmotic brain."], "e": "Slide 33: osmotic oedema arises from an osmolality mismatch; common cause = too-rapid treatment of hypernatraemia with isotonic or hypotonic fluids; others: haemodialysis, glucose derangements, SIADH, excessive water intake.", "tr": "This is also why the lecture says “avoid hypotonic fluids” in raised ICP.", "m": "", "g": "osmotic", "sl": "N33", "lec": "Neural Function", "sn": 33}, {"c": "v2", "s": "Level 3 · Advanced", "l": 3, "t": "Exception", "q": "All of the following are causes of OSMOTIC cerebral oedema listed in the lecture, EXCEPT:", "o": ["Excessive water intake", "Syndrome of inappropriate antidiuretic hormone", "Brain tumour", "Haemodialysis"], "a": [2], "w": ["Listed.", "Listed (slide 33).", "Correct: tumours cause vasogenic oedema.", "Listed."], "e": "Osmotic oedema causes: too-rapid correction of hypernatraemia, haemodialysis, glucose derangements, SIADH, excessive water intake.", "tr": "", "m": "", "g": "osmotic", "sl": "N33", "lec": "Neural Function", "sn": 33}, {"c": "v2", "s": "Level 2 · Intermediate", "l": 2, "t": "Graph", "q": "Typical CT appearance of hydrocephalus in the lecture:", "o": ["Ventricular enlargement with effacement of the peripheral sulci", "Normal ventricles with a lens-shaped collection", "Midline shift with a crescent collection", "Small slit-like ventricles"], "a": [0], "w": ["Correct (slide 35).", "That suggests an epidural haematoma.", "That suggests a subdural haematoma.", "Opposite."], "e": "CSF accumulates in the ventricles, which dilate and push the brain against the skull, flattening the sulci.", "tr": "", "m": "", "g": "hydro", "sl": "N32", "lec": "Neural Function", "sn": 32}, {"c": "v2", "s": "Level 2 · Intermediate", "l": 2, "t": "Classification", "q": "Which of the following raise ICP by DECREASING CSF absorption? (multiple answers)", "o": ["Communicating hydrocephalus", "Arachnoid granulation adhesions after meningitis", "Subarachnoid haemorrhage", "Choroid plexus papilloma"], "a": [0, 1, 2], "w": ["Correct (slide 35).", "Correct.", "Correct (blood clogs the granulations).", "This INCREASES CSF production."], "e": "Slide 35: ↑ production → hydrocephalus, choroid plexus papilloma; ↓ absorption → communicating hydrocephalus, arachnoid granulation adhesions after meningitis, subarachnoid haemorrhage.", "tr": "", "m": "", "g": "etio", "sl": "N35", "lec": "Neural Function", "sn": 35}, {"c": "v2", "s": "Level 2 · Intermediate", "l": 2, "t": "Classification", "q": "Which is listed in the lecture as a MASS LESION causing raised ICP?", "o": ["Epidural haematoma", "Vasculitis", "Encephalitis", "Ruptured aneurysm"], "a": [0], "w": ["Correct: mass lesions = tumour, haematoma (subdural, epidural).", "Listed separately.", "CNS infection, listed separately.", "Listed under intracranial haemorrhage."], "e": "Etiologies (slide 34): TBI/diffuse axonal injury; intracranial haemorrhage (ruptured aneurysm, AVMs); mass lesions (tumour, haematoma subdural/epidural); CNS infections (encephalitis, abscess); ischaemic stroke; vasculitis. Slide 35 adds ↑ CSF production, hypertensive encephalopathy, idiopathic intracranial hypertension, ↓ CSF absorption.", "tr": "", "m": "", "g": "etio", "sl": "N34", "lec": "Neural Function", "sn": 34}, {"c": "v2", "s": "Level 1 · Basic", "l": 1, "t": "Clinical", "q": "Which symptoms from the history suggest raised ICP? (multiple answers)", "o": ["Projectile vomiting", "Blurry vision and photophobia", "Intense headache", "Productive cough"], "a": [0, 1, 2], "w": ["Correct.", "Correct (visual symptoms).", "Correct (slide 36).", "Not a symptom of raised ICP."], "e": "History: intense headache, visual symptoms (blurry vision, photophobia), drowsiness, projectile vomiting, and a recent history of trauma, stroke, cancer or metabolic disease.", "tr": "", "m": "", "g": "symptoms", "sl": "N36", "lec": "Neural Function", "sn": 36}, {"c": "v2", "s": "Level 2 · Intermediate", "l": 2, "t": "Definition", "q": "The Cushing triad consists of:", "o": ["Elevated blood pressure, bradycardia, irregular respiration", "Headache, vomiting, papilloedema", "Fever, neck stiffness, photophobia", "Hypotension, tachycardia, tachypnoea"], "a": [0], "w": ["Correct (slide 37).", "Classic symptoms of raised ICP, but not the Cushing triad.", "Meningeal signs.", "That is the picture of shock."], "e": "Cushing triad = late sign of raised ICP, possibly due to brainstem compression: hypertension (to keep CPP), bradycardia (baroreflex), irregular respiration (medullary compression).", "tr": "Cushing triad = the OPPOSITE of shock (hypotension + tachycardia).", "m": "“HBR” — Hypertension, Bradycardia, Respiration irregular.", "g": "cushing", "sl": "N37", "lec": "Neural Function", "sn": 37}, {"c": "v2", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "On eye examination, which signs suggest raised ICP? (multiple answers)", "o": ["Abducens (CN VI) nerve palsy", "Papilloedema on ophthalmoscopy", "Spontaneous periorbital bruising", "Pinpoint pupils"], "a": [0, 1, 2], "w": ["Correct.", "Correct (slide 37).", "Correct (listed on slide 37).", "Pinpoint pupils suggest opioids (respiratory lecture, Patient 1)."], "e": "Eye exam (slide 37): papilloedema, CN VI palsy, spontaneous periorbital bruising. An ipsilateral dilated pupil (anisocoria) is a sign of uncal herniation.", "tr": "", "m": "", "g": "eyes", "sl": "N37", "lec": "Neural Function", "sn": 37}, {"c": "v2", "s": "Level 2 · Intermediate", "l": 2, "t": "Clinical", "q": "In an infant, a specific sign of raised ICP is:", "o": ["Papilloedema always present", "Sunken fontanelle", "Bulging fontanelle", "Barrel chest"], "a": [2], "w": ["Infants’ open sutures/fontanelles buffer pressure; papilloedema may be absent.", "Suggests dehydration.", "Correct (slide 38).", "Emphysema."], "e": "Slide 38 adds: altered mental status, seizures, focal and progressive neurological changes (local mass effect, herniation), and in infants a bulging fontanelle.", "tr": "", "m": "", "g": "infant", "sl": "N38", "lec": "Neural Function", "sn": 38}, {"c": "v2", "s": "Level 3 · Advanced", "l": 3, "t": "Classification", "q": "Herniation of the cingulate gyrus under the falx cerebri is called:", "o": ["Uncal herniation", "Subfalcine herniation", "Transcalvarial herniation", "Tonsillar herniation"], "a": [1], "w": ["Uncal = medial temporal lobe over the tentorium.", "Correct (slide 27).", "Transcalvarial = through a skull defect.", "Tonsillar = cerebellar tonsils through the foramen magnum."], "e": "Types on slide 27: subfalcine (cingulate), central (transtentorial), uncal (transtentorial), tonsillar (downward cerebellar), upward, transcalvarial (external).", "tr": "", "m": "", "g": "hernia", "sl": "N27", "lec": "Neural Function", "sn": 27}, {"c": "v2", "s": "Level 4 · Expert", "l": 4, "t": "Integrated", "q": "A head-injured patient develops a dilated right pupil, then irregular breathing and bradycardia. The sequence best fits:", "o": ["Hydrocephalus with interstitial oedema", "Uncal (transtentorial) herniation compressing CN III, progressing to brainstem compression", "Upward herniation from a posterior fossa mass", "Subfalcine herniation only"], "a": [1], "w": ["No sign of ventricular obstruction described.", "Correct.", "Not suggested.", "Usually silent, does not compress the brainstem."], "e": "Uncus pushed over the tentorial edge compresses the oculomotor nerve (ipsilateral mydriasis, anisocoria) then the midbrain; downward pressure on the medulla gives irregular respiration and Cushing-type bradycardia → death if untreated.", "tr": "Anisocoria + deteriorating consciousness = neurosurgical emergency (trephination, decompression).", "m": "", "g": "hernia", "sl": "N27", "lec": "Neural Function", "sn": 27}, {"c": "v2", "s": "Level 3 · Advanced", "l": 3, "t": "Mechanism", "q": "Put the chain of cerebral oedema in the order shown in the lecture: (1) CPP decreases → ischaemic damage → herniation; (2) fluid accumulates in the brain extracellular space; (3) ICP rises and outweighs autoregulation; (4) relative increase of brain tissue volume.", "o": ["2 → 3 → 4 → 1", "2 → 4 → 3 → 1", "4 → 2 → 1 → 3", "3 → 2 → 4 → 1"], "a": [1], "w": ["Volume must rise before ICP rises.", "Correct (slide 28).", "Order wrong.", "Starts with the consequence."], "e": "Accumulation of fluid (TBI, stroke, tumours, infection) → oedema/↑ brain tissue volume → ICP ↑ outweighs autoregulation → CPP ↓ → ischaemic damage → herniation.", "tr": "", "m": "", "g": "edemachain", "sl": "N28", "lec": "Neural Function", "sn": 28}, {"c": "v3", "s": "Level 1 · Basic", "l": 1, "t": "Concept", "q": "Which of the following belong to the INITIAL management of raised ICP? (multiple answers)", "o": ["Paralytic agents and adequate sedation if intubation is needed", "Close monitoring of vital signs and ECG", "Immediate support of oxygenation and blood pressure", "Rapid infusion of hypotonic fluids"], "a": [0, 1, 2], "w": ["Correct.", "Correct.", "Correct (slide 39).", "The lecture says AVOID hypotonic fluids (they worsen brain oedema)."], "e": "Protect CPP (BP), protect O₂, avoid anything that raises ICP (agitation, coughing on the tube) and anything that adds brain water (hypotonic fluids).", "tr": "", "m": "", "g": "initial", "sl": "N39", "lec": "Neural Function", "sn": 39}, {"c": "v3", "s": "Level 2 · Intermediate", "l": 2, "t": "Mechanism", "q": "Elevating the head of the bed above 30° lowers ICP mainly by:", "o": ["Dehydrating brain tissue", "Promoting cerebral venous drainage, so ↓ intracranial blood volume", "Increasing arterial inflow", "Increasing CSF production"], "a": [1], "w": ["That is the osmotherapy mechanism.", "Correct (slide 40).", "That would raise ICP.", "That would raise ICP."], "e": "Monro–Kellie target: blood compartment. Gravity helps venous blood leave the skull through the jugular veins.", "tr": "", "m": "", "g": "hob", "sl": "N40", "lec": "Neural Function", "sn": 40}, {"c": "v3", "s": "Level 3 · Advanced", "l": 3, "t": "Mechanism", "q": "Mannitol and hypertonic saline reduce ICP by:", "o": ["Lowering body temperature", "Constricting cerebral arterioles", "Creating an osmotic gradient that moves water from the brain extracellular space into the vessels", "Decreasing CSF production"], "a": [2], "w": ["That is hypothermia.", "That is hyperventilation’s mechanism.", "Correct (slide 40).", "That is acetazolamide’s mechanism."], "e": "Both raise plasma tonicity; water leaves the brain interstitium → ↓ brain oedema (brain compartment). With hypertonic saline: monitor serum sodium and maintain euvolaemia.", "tr": "", "m": "", "g": "osmo", "sl": "N40", "lec": "Neural Function", "sn": 40}, {"c": "v3", "s": "Level 2 · Intermediate", "l": 2, "t": "Mechanism", "q": "Acetazolamide lowers ICP by acting on which Monro–Kellie compartment?", "o": ["Arterial blood", "Brain tissue", "Venous blood", "CSF — it decreases CSF production"], "a": [3], "w": ["It is not a vasoconstrictor.", "It does not dehydrate the brain.", "It does not affect venous drainage.", "Correct (slide 42)."], "e": "Acetazolamide = a diuretic that decreases CSF production → ↓ CSF volume → ↓ ICP.", "tr": "", "m": "", "g": "acetazol", "sl": "N42", "lec": "Neural Function", "sn": 42}, {"c": "v3", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Steroids are beneficial in raised ICP when the oedema is:", "o": ["Osmotic, as in hyponatraemia", "Vasogenic, as with brain tumours", "Interstitial, as in hydrocephalus", "Cytotoxic, as after a stroke"], "a": [1], "w": ["Not the indication.", "Correct (slide 43).", "Hydrocephalus needs CSF drainage/shunt.", "Steroids do not fix energy failure."], "e": "Steroids decrease CSF production, stabilise membranes and restore normal membrane permeability → they treat the leaky BBB of tumours.", "tr": "", "m": "", "g": "steroids", "sl": "N43", "lec": "Neural Function", "sn": 43}, {"c": "v3", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Lowering body temperature (hypothermia) in brain injury is associated with a decrease in:", "o": ["Cardiac output only", "Only ICP, with no effect on metabolism", "Blood glucose", "Cerebral blood flow, ICP and metabolism"], "a": [3], "w": ["Not the effect described.", "Metabolism falls too.", "Not the effect described.", "Correct (slide 43)."], "e": "Lower temperature ↓ cerebral metabolic demand → ↓ CBF (coupled) → ↓ blood volume → ↓ ICP. Conversely, fever raises ICP — hence antipyretics if febrile.", "tr": "", "m": "", "g": "hypothermia", "sl": "N43", "lec": "Neural Function", "sn": 43}, {"c": "v3", "s": "Level 3 · Advanced", "l": 3, "t": "Mechanism", "q": "Induced coma with propofol helps control ICP because it:", "o": ["Reduces sympathetic activity and cerebral metabolic demand", "Raises PaCO₂", "Increases CSF absorption", "Draws water out of the brain osmotically"], "a": [0], "w": ["Correct (slide 42).", "Sedation may depress breathing, but raising PaCO₂ would INCREASE ICP; ventilation is controlled.", "Not its mechanism.", "That is mannitol/hypertonic saline."], "e": "↓ metabolic demand → ↓ CBF (flow–metabolism coupling) → ↓ cerebral blood volume; plus less agitation and sympathetic surges.", "tr": "", "m": "", "g": "coma", "sl": "N42", "lec": "Neural Function", "sn": 42}, {"c": "v3", "s": "Level 3 · Advanced", "l": 3, "t": "Clinical", "q": "In a patient with an acute epidural haematoma and deteriorating neurological findings, skull trephination has been shown to:", "o": ["Only be useful in chronic subdural haematoma", "Have no benefit compared with medical treatment", "Improve both short- and long-term neurological outcomes", "Be contraindicated if there is anisocoria"], "a": [2], "w": ["The slide is about acute epidural haematoma.", "The lecture says it improves outcomes.", "Correct (slide 44).", "Anisocoria is one of the deteriorating findings that indicates it."], "e": "Deteriorating findings = decreasing level of consciousness, anisocoria, hemiparesis. Trephination (bur hole) is an ancient (Neolithic) but lifesaving decompression.", "tr": "", "m": "", "g": "trephin", "sl": "N44", "lec": "Neural Function", "sn": 44}, {"c": "v3", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "The DEFINITIVE treatment of raised ICP secondary to a space-occupying lesion is:", "o": ["Mannitol", "Operative management (craniotomy or ventriculostomy with drainage of blood and CSF)", "Steroids", "Hyperventilation"], "a": [1], "w": ["Temporary measure.", "Correct (slide 46).", "Only for vasogenic oedema around tumours.", "Temporary measure."], "e": "Medical measures buy time; removing the mass (or draining CSF/blood) treats the cause. Hydrocephalus is treated with shunts.", "tr": "", "m": "", "g": "operative", "sl": "N46", "lec": "Neural Function", "sn": 46}, {"c": "v3", "s": "Level 4 · Expert", "l": 4, "t": "Integrated", "q": "Match each ICP treatment to the Monro–Kellie compartment it reduces. Which pairing is WRONG?", "o": ["Acetazolamide → blood", "Mannitol → brain", "Ventriculostomy → CSF", "Head elevation > 30° → blood"], "a": [0], "w": ["WRONG pairing: acetazolamide reduces CSF production.", "Correct pairing (osmotic dehydration of brain tissue).", "Correct pairing (drains CSF).", "Correct pairing (venous drainage)."], "e": "Blood: head up, hyperventilation, sedation/hypothermia (↓ CBF). Brain: mannitol, hypertonic saline, steroids (vasogenic). CSF: acetazolamide, ventricular drain, shunt. Mass: surgery.", "tr": "", "m": "", "g": "monrotreat", "sl": "N40", "lec": "Neural Function", "sn": 40}, {"c": "v3", "s": "Level 3 · Advanced", "l": 3, "t": "Exception", "q": "Which fluid strategy is WRONG in a patient with raised ICP?", "o": ["Monitor serum sodium", "Optimise blood glucose", "Give hypotonic fluids to dilute the blood", "Maintain euvolaemia"], "a": [2], "w": ["Recommended.", "Recommended (glucose control).", "Wrong: hypotonic fluids worsen brain oedema (slide 39).", "Recommended with hypertonic saline."], "e": "Hypotonic plasma → water moves into the brain (osmotic oedema). Fluids must be isotonic or hypertonic.", "tr": "", "m": "", "g": "fluids", "sl": "N39", "lec": "Neural Function", "sn": 39}, {"c": "v3", "s": "Level 4 · Expert", "l": 4, "t": "Integrated", "q": "In the TBI model of the lecture, why does ischaemia lead to a further rise in ICP?", "o": ["Ischaemia increases CSF production.", "Ischaemia improves autoregulation.", "Ischaemia raises MAP.", "Ischaemia causes cytotoxic oedema (and BBB damage → vasogenic oedema), which increases brain volume and therefore ICP."], "a": [3], "w": ["Not the mechanism shown.", "Autoregulation is impaired after TBI.", "Not the mechanism.", "Correct (slides 48–49)."], "e": "Vicious circle: ↑ ICP → ↓ CPP → ischaemia → oedema → ↑ ICP. Take-home: ischaemia resulting from raised ICP and reduced CPP causes more swelling, which in turn elevates ICP further.", "tr": "", "m": "", "g": "tbi", "sl": "N48", "lec": "Neural Function", "sn": 48}, {"c": "v3", "s": "Level 5 · Elite", "l": 5, "t": "Elite", "q": "After a severe TBI, autoregulation is impaired. Which statement best explains why BOTH hypotension and severe hypertension are dangerous in this patient?", "o": ["Because ICP is independent of blood pressure after TBI.", "Because hypotension increases ICP directly by Monro–Kellie.", "Because hypertension causes bradycardia and apnoea.", "CBF becomes pressure-passive: hypotension → hypoperfusion and ischaemia (cytotoxic oedema); hypertension → hyperperfusion, BBB disruption and vasogenic oedema — both raise ICP."], "a": [3], "w": ["CBF depends on pressure when autoregulation is lost.", "Hypotension lowers CPP; it does not add volume directly.", "That describes the Cushing reflex, not the reason both extremes harm.", "Correct (slide 48)."], "e": "Slide 48: impaired autoregulation → hypoperfusion (ischaemia → cytotoxic oedema) or hyperperfusion (↑ ICP, BBB ↓ → vasogenic oedema). Both feed secondary injury.", "tr": "", "m": "", "g": "tbi", "sl": "N48", "lec": "Neural Function", "sn": 48}, {"c": "v3", "s": "Level 5 · Elite", "l": 5, "t": "Elite", "q": "A patient with a large haematoma has BP 190/100, HR 44 and irregular breathing. A junior doctor wants to lower the BP urgently “to protect the brain”. The best physiological objection is:", "o": ["Irregular breathing means the patient only needs oxygen.", "The bradycardia proves the patient is hypovolaemic.", "High BP has no effect on CPP.", "The hypertension is a Cushing response that tries to maintain CPP against a very high ICP; lowering MAP without lowering ICP would reduce CPP further."], "a": [3], "w": ["It signals brainstem compression — the priority is lowering ICP (surgery).", "Hypovolaemia gives tachycardia.", "CPP depends directly on MAP.", "Correct: CPP = MAP − ICP."], "e": "Cushing triad = brainstem compression from raised ICP. The priority is to treat the cause (decompression) and lower ICP; MAP is propping up CPP.", "tr": "Treat the ICP, not the compensatory BP.", "m": "", "g": "cushingreason", "sl": "N26", "lec": "Neural Function", "sn": 26}, {"c": "c1", "s": "Level 1 · Basic", "l": 1, "t": "Definition", "q": "The main function of the cardiovascular system, as defined in the lecture, is to:", "o": ["Maintain a normal blood pressure at all times", "Keep the heart rate between 60 and 100", "Deliver continuously, to every tissue, enough oxygenated blood to meet its needs, and remove CO₂ and metabolic waste", "Pump 5 L of blood per minute"], "a": [2], "w": ["Blood pressure is a means; the lecture insists a normal BP does not rule out shock.", "Not the definition.", "Correct (slide 3).", "That is a normal resting value, not the function."], "e": "Function = matching O₂ delivery to O₂ demand. It relies on four elements: blood volume, the heart, vessel tone and a free circuit.", "tr": "", "m": "", "g": "cvfunction", "sl": "C3", "lec": "Cardio-vascular Function", "sn": 3}, {"c": "c1", "s": "Level 1 · Basic", "l": 1, "t": "Equation", "q": "Cardiac output equals:", "o": ["Heart rate × stroke volume", "MAP × SVR", "Stroke volume ÷ heart rate", "DO₂ × CaO₂"], "a": [0], "w": ["Correct (slide 9).", "MAP = CO × SVR, not CO.", "Wrong operation.", "DO₂ = CO × CaO₂."], "e": "CO = HR × SV ≈ 70 × 70 mL ≈ 5 L/min at rest. SV depends on preload, contractility and afterload.", "tr": "", "m": "", "g": "co", "sl": "C9", "lec": "Cardio-vascular Function", "sn": 9}, {"c": "c1", "s": "Level 2 · Intermediate", "l": 2, "t": "Calculation", "q": "A patient has a heart rate of 120/min and a stroke volume of 40 mL. His cardiac output is:", "o": ["4.8 L/min", "6.0 L/min", "160 mL/min", "3.0 L/min"], "a": [0], "w": ["Correct: 120 × 0.040 L = 4.8 L/min.", "Would need SV = 50 mL.", "Added instead of multiplied.", "Would need SV = 25 mL."], "e": "Tachycardia partly compensates a low SV (e.g. haemorrhage). CO is nearly normal, but SV is low.", "tr": "A near-normal CO can hide a very low stroke volume.", "m": "", "g": "co", "sl": "C9", "lec": "Cardio-vascular Function", "sn": 9}, {"c": "c1", "s": "Level 2 · Intermediate", "l": 2, "t": "Classification", "q": "Which of the four determinants of cardiac output are called “coupling factors” on the lecture diagram (factors linking heart and vessels)? (multiple answers)", "o": ["Heart rate", "Myocardial contractility", "Afterload", "Preload"], "a": [2, 3], "w": ["Cardiac factor.", "Cardiac factor.", "Correct.", "Correct (slide 10)."], "e": "Slide 10: cardiac factors = heart rate, myocardial contractility; coupling factors = preload, afterload. Preload, contractility and afterload set the stroke volume.", "tr": "", "m": "", "g": "4factors", "sl": "C10", "lec": "Cardio-vascular Function", "sn": 10}, {"c": "c1", "s": "Level 2 · Intermediate", "l": 2, "t": "Definition", "q": "Preload is best defined as:", "o": ["The number of beats per minute", "The resistance the ventricle ejects against", "The strength of the squeeze at a given length", "The filling / stretch of the ventricle before it contracts"], "a": [3], "w": ["That is heart rate.", "That is afterload.", "That is contractility (inotropy).", "Correct (slide 9)."], "e": "Preload ≈ end-diastolic volume/stretch. CVP is used as an estimate of right-heart preload. Haemorrhage empties the ventricle → SV falls.", "tr": "", "m": "", "g": "preload", "sl": "C9", "lec": "Cardio-vascular Function", "sn": 9}, {"c": "c1", "s": "Level 2 · Intermediate", "l": 2, "t": "Clinical", "q": "Match the failing determinant with the lecture’s example. Which pairing is correct?", "o": ["Contractility — haemorrhage", "Afterload — massive pulmonary embolism overloading the right ventricle", "Heart rate — sepsis", "Afterload — myocardial infarction"], "a": [1], "w": ["Haemorrhage is the preload example.", "Correct (slide 9).", "The HR example is extreme brady/tachycardia (complete heart block).", "MI is the contractility example."], "e": "Slide 9: HR → complete heart block; preload → haemorrhage; contractility → myocardial infarction; afterload → massive PE.", "tr": "", "m": "", "g": "4fail", "sl": "C9", "lec": "Cardio-vascular Function", "sn": 9}, {"c": "c1", "s": "Level 2 · Intermediate", "l": 2, "t": "Definition", "q": "The mean circulatory (static) pressure, Pmc, is:", "o": ["The pressure at which the aortic valve opens", "The pressure in the right atrium at a CO of 5 L/min", "The mean arterial pressure during exercise", "The equilibrium pressure throughout the cardiovascular system when cardiac output is zero"], "a": [3], "w": ["No.", "That is point A on the curve.", "No.", "Correct (slide 11)."], "e": "With the heart stopped, pressures equalise everywhere to Pmc (≈ 7 mmHg on the graph). It depends on blood volume and venous tone and drives venous return (Psf − RAP).", "tr": "", "m": "", "g": "pmc", "sl": "C11", "lec": "Cardio-vascular Function", "sn": 11}, {"c": "c1", "s": "Level 3 · Advanced", "l": 3, "t": "Graph", "q": "On the vascular function curve (CVP vs CO), why does CVP fall as cardiac output increases?", "o": ["Because high CO always means high SVR.", "Because the heart contracts more strongly at low CVP.", "The faster the heart pumps, the more blood it transfers from the veins into the arteries, lowering venous pressure.", "Because Pmc falls when CO rises."], "a": [2], "w": ["Not the mechanism.", "Frank–Starling says the reverse.", "Correct.", "Pmc is a property of volume/tone, not of CO."], "e": "The vascular function curve shows the CVP produced by a given CO. At CO = 0, CVP = Pmc; as CO rises, veins are emptied and CVP falls (points B at 1 L/min, A at 5 L/min).", "tr": "", "m": "", "g": "vfc", "sl": "C11", "lec": "Cardio-vascular Function", "sn": 11}, {"c": "c1", "s": "Level 3 · Advanced", "l": 3, "t": "Graph", "q": "After a haemorrhage, the vascular function curve:", "o": ["Shifts up and to the right (higher Pmc)", "Shifts down and to the left (lower Pmc), so less venous return at any CVP", "Rotates without changing Pmc", "Does not change; only the cardiac function curve moves"], "a": [1], "w": ["That is transfusion.", "Correct (slides 14, 33).", "A rotation (same Pmc) reflects resistance changes, not volume.", "Volume changes move the vascular curve."], "e": "Slide 14: Pmc ≈ 5 (haemorrhage), 7 (normal), 9 mmHg (transfusion). Less filling pressure → less venous return → less preload → less CO.", "tr": "", "m": "", "g": "vfcshift", "sl": "C14", "lec": "Cardio-vascular Function", "sn": 14}, {"c": "c1", "s": "Level 3 · Advanced", "l": 3, "t": "Graph", "q": "On Guyton’s combined graph, sympathetic stimulation moves the equilibrium from A (CO 5 L/min) to D. Compared with A, point D has:", "o": ["The same CO and lower CVP", "Lower CO and higher CVP", "Higher CO and higher CVP", "Higher CO and lower CVP"], "a": [3], "w": ["CO rises.", "That is heart failure.", "That pattern fits hypervolaemia/transfusion.", "Correct (slides 12/17)."], "e": "Sympathetic stimulation lifts the cardiac function curve (↑ HR, ↑ contractility). The stronger heart empties the veins: CO rises to ≈ 6 L/min while CVP falls.", "tr": "Steps A → B → C → D: first CO jumps at the same CVP, then CVP falls to the new equilibrium.", "m": "", "g": "guyton", "sl": "C12", "lec": "Cardio-vascular Function", "sn": 12}, {"c": "c1", "s": "Level 4 · Expert", "l": 4, "t": "Graph", "q": "In heart failure (slide 18), the cardiac function curve is lower and flatter. Adding volume (hypervolaemia) moves the equilibrium to a point with:", "o": ["Lower CO and lower CVP", "Partly restored CO but a much higher CVP", "Normal CO and normal CVP", "Higher CO and lower CVP"], "a": [1], "w": ["Volume raises CVP.", "Correct: equilibrium D/E on the hypervolaemia curve.", "Volume cannot normalise both.", "Only a stronger heart does that."], "e": "The failing heart needs a higher filling pressure (Frank–Starling) to deliver CO; the price is congestion (high CVP, oedema). Hence “fluid can drown a failing pump.”", "tr": "", "m": "", "g": "hf", "sl": "C18", "lec": "Cardio-vascular Function", "sn": 18}, {"c": "c1", "s": "Level 2 · Intermediate", "l": 2, "t": "Concept", "q": "Which change shifts the cardiac function curve UP (more CO for the same preload)?", "o": ["Increased afterload", "Decreased afterload", "Myocardial damage", "Decreased heart rate"], "a": [1], "w": ["Shifts it down.", "Correct (slide 13).", "Shifts it down.", "Shifts it down."], "e": "Up: ↑ HR, ↑ contractility, ↓ afterload. Down: ↓ HR, ↓ contractility (myocardial damage), ↑ afterload.", "tr": "", "m": "", "g": "cfcshift", "sl": "C13", "lec": "Cardio-vascular Function", "sn": 13}, {"c": "c1", "s": "Level 2 · Intermediate", "l": 2, "t": "Mechanism", "q": "The Frank–Starling mechanism states that:", "o": ["Contractility depends only on sympathetic tone.", "Increased end-diastolic volume increases stroke volume — up to a point.", "Heart rate rises when venous return rises.", "Increased afterload increases stroke volume."], "a": [1], "w": ["Frank–Starling is intrinsic and length-dependent.", "Correct (slide 17).", "That is a reflex, not Frank–Starling.", "Afterload decreases SV."], "e": "Stretch to squeeze: stretching fibres optimises actin–myosin overlap (sarcomere length–tension), so force rises with filling — until over-stretch.", "tr": "", "m": "“Stretch to Squeeze.”", "g": "fs", "sl": "C16", "lec": "Cardio-vascular Function", "sn": 16}, {"c": "c1", "s": "Level 3 · Advanced", "l": 3, "t": "Concept", "q": "The cellular basis of the Frank–Starling law is:", "o": ["The sarcomere length–tension relationship: stretching gives optimal actin–myosin overlap", "An increase in coronary flow", "An increase in heart rate with filling", "β1-receptor stimulation"], "a": [0], "w": ["Correct (slide 16).", "Not the mechanism.", "Not the cellular basis.", "That is inotropy (contractility), a different mechanism."], "e": "Length dependence of cardiac contraction → volume–pressure relationship reflects sarcomere length–tension; stretching enhances force through optimal actin–myosin overlap.", "tr": "Moving ALONG the curve (Frank–Starling) ≠ moving the curve (inotropy).", "m": "", "g": "fs", "sl": "C16", "lec": "Cardio-vascular Function", "sn": 16}, {"c": "c1", "s": "Level 1 · Basic", "l": 1, "t": "Equation", "q": "Mean arterial pressure equals:", "o": ["CO × SVR", "CO + SVR", "HR × SV", "CO ÷ SVR"], "a": [0], "w": ["Correct (slide 15): Ohm’s law.", "Pressure = flow × resistance.", "That is CO.", "Inverted."], "e": "MAP = CO × SVR = HR × SV × SVR. Rearranged: CO = (MAP − RAP)/SVR.", "tr": "", "m": "", "g": "map", "sl": "C15", "lec": "Cardio-vascular Function", "sn": 15}, {"c": "c1", "s": "Level 3 · Advanced", "l": 3, "t": "Cause-effect", "q": "In EARLY haemorrhage, MAP is often normal because:", "o": ["Stroke volume increases by Frank–Starling.", "SVR rises strongly (reflex vasoconstriction), compensating the fall in CO.", "Blood viscosity falls.", "Cardiac output increases."], "a": [1], "w": ["Preload falls, so SV falls.", "Correct (slide 15).", "Not the mechanism in the lecture.", "CO falls when blood is lost."], "e": "CO ↓, SVR ↑↑ → MAP maintained. Reflex vasoconstriction hides the loss of flow; tissues are already under-perfused.", "t min, ≈ 25 % extracted.", "Correct value.", "Correct value.", "Correct value."], "e": "At rest only ≈ 25 % of delivered O₂ is extracted, which is why venous blood is still ≈ 70–75 % saturated (SvO₂). This reserve is what tissues use when delivery falls.", "tr": "", "m": "", "g": "do2vals", "sl": "C7", "lec": "Cardio-vascular Function", "sn": 7}, {"c": "c1", "s": "Level 3 · Advanced", "l": 3, "t": "Calculation", "q": "Hb 15 g/dL, SaO₂ 100 %. Ignoring dissolved O₂, CaO₂ is approximately:", "o": ["134 mL/dL", "2 mL/dL", "20 mL/dL (200 mL/L)", "15 mL/dL"], "a": [2], "w": ["Decimal error.", "Decimal error.", "Correct: 1.34 × 15 × 1.0 ≈ 20 mL/dL.", "Forgot the 1.34 factor."], "e": "CaO₂ = 1.34 × Hb × SaO₂ (+ 0.003 × PaO₂). Each gram of Hb carries 1.34 mL O₂ when fully saturated.", "tr": "", "m": "", "g": "cao2", "sl": "C19", "lec": "Cardio-vascular Function", "sn": 19}, {"c": "c1", "s": "Level 4 · Expert", "l": 4, "t": "Calculation", "q": "VO₂ = 250 mL/min, CaO₂ = 200 mL/L, CvO₂ = 150 mL/L. Using the Fick principle, CO is:", "o": ["5 L/min", "0.2 L/min", "50 L/min", "1.25 L/min"], "a": [0], "w": ["Correct: 250 ÷ (200 − 150) = 5 L/min.", "Inverted.", "Unit error.", "250/200 — forgot to subtract CvO₂."], "e": "VO₂ = CO × (CaO₂ − CvO₂) → CO = VO₂ ÷ (CaO₂ − CvO₂). Worked example of slide 19.", "tr": "", "m": "", "g": "fick", "sl": "C19", "lec": "Cardio-vascular Function", "sn": 19}, {"c": "c1", "s": "Level 4 · Expert", "l": 4, "t": "Mechanism", "q": "In which situation can SvO₂ be NORMAL or HIGH despite shock?", "o": ["Cardiogenic shock", "Septic shock", "Obstructive shock", "Haemorrhagic shock"], "a": [1], "w": ["Low flow → SvO₂ falls.", "Correct: cells can’t use O₂ (extraction fails), so venous O₂ stays high.", "Low flow → SvO₂ falls.", "Low flow → tissues extract more → SvO₂ falls."], "e": "Slide 19: flow falls (hypovolaemic, cardiogenic, obstructive) → more extraction → CvO₂, SvO₂ ↓. Hb falls → double hit. Extraction fails (sepsis) → SvO₂ normal or high.", "tr": "A normal
