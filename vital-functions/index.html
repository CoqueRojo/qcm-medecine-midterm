 list.forEach((q,k)=>{h+=cardL(q,k+1)});document.getElementById("main").innerHTML=h;
 document.querySelectorAll("#main .qcard").forEach(el=>{const id=+el.id.slice(1);const s=state[id];if(s&&s.done){/* show as fresh */}})}
function mistView(){const list=mistList().sort((a,b)=>(state[b.id].miss||0)-(state[a.id].miss||0));
 let h=listView("Mistakes notebook","Every question you have missed at least once",list,"No mistakes recorded yet.","📕");
 const by={};list.forEach(q=>{const k=q.g||("q"+q.id);by[k]=(by[k]||0)+(state[q.id].miss||0)});
 const weak=CH.map(c=>{const qs=list.filter(q=>q.c===c.id);return [c,qs.reduce((s,q)=>s+state[q.id].miss,0)]}).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
 if(weak.length)h+=`<div class="card"><div class="sec">Most misunderstood chapters</div>${weak.map(([c,n])=>`<div class="pc ${part(c.id)}" style="margin:6px 0"><div><b>${c.num}. ${c.t}</b><span>${n} mistake${n>1?"s":""}</span></div></div>`).join("")}
 <div class="tools"><button class="btn pri" onclick="remediate()">🎯 Remediation exam on my mistakes (+ twins)</button></div></div>`;
 list.forEach((q,k)=>{const s=state[q.id];const last=(s.hist||[]).filter(x=>x[1]<1).slice(-1)[0];const c=CH.find(x=>x.id===q.c);
  h+=`<div class="card mist"><div class="small">Ch. ${c.num} · ${c.t} · ${q.lec}, slide ${q.sn} · missed ${s.miss}× ${last?"· last on "+new Date(last[0]).toLocaleDateString():""}</div>
  <div class="stem" style="margin:6px 0">${q.q}</div>
  ${last&&last[2].length?`<div class="small" style="color:#c0392b">Your answer: ${last[2].map(i=>q.o[i]).join(" · ")}</div>`:""}
  <div class="small" style="color:#23784f">Correct: ${q.a.map(i=>q.o[i]).join(" · ")}</div>
  <div class="small" style="margin-top:6px">${q.e}</div>${q.tr?`<div class="box2 trapb"><b>Exam trap</b>${q.tr}</div>`:""}
  <div class="tools"><button class="btn" onclick="go('${q.c}');setTimeout(()=>{undo(${q.id});document.getElementById('q${q.id}').scrollIntoView()},80)">Redo this question</button>${twins(q).length?`<button class="btn twin" onclick="goTwin(${q.id})">🔁 Twin question</button>`:""}</div></div>`});
 document.getElementById("main").innerHTML=h}
function remediate(){let ids=new Set();mistList().forEach(q=>{ids.add(q.id);twins(q).forEach(t=>ids.add(t.id))});EX.list=shuf([...ids].map(i=>Q[i])).slice(0,40);EX.ans={};EX.sub=false;EX.cur=0;EX.list.forEach(q=>delete PERM[q.id]);go("exam")}
let FCS={p:"all",i:0,show:false,order:null};
function flashView(){const deck=FC.map((c,i)=>Object.assign({i},c)).filter(c=>FCS.p==="all"||c.p===FCS.p);if(!FCS.order||FCS.order.length!==deck.length)FCS.order=shuf(deck.map((_,k)=>k));
 const k=Math.min(FCS.i,deck.length-1);const c=deck[FCS.order[k]];const pc={v:"vneu",c:"vcar",r:"vres",x:"vint"}[c.p];
 let h=listView("Flashcards","Active recall — from the revision sheets of the handbook",[1],"","🃏");
 h+=`<div class="qsel">${[["all","All"],["v","Neural"],["c","Cardiovascular"],["r","Respiratory"],["x","Integration"]].map(([v,t])=>`<button class="btn ${FCS.p===v?"pri":""}" onclick="FCS={p:'${v}',i:0,show:false,order:null};render('flash')">${t}</button>`).join("")}</div>
 <div class="fc ${pc}" onclick="FCS.show=!FCS.show;render('flash')"><div class="f">${c.f}</div>${FCS.show?`<div class="b">${c.b}</div>`:`<div class="h">Say the answer out loud, then click to flip</div>`}</div>
 <div class="navb"><button class="btn" ${k?"":"disabled"} onclick="FCS.i--;FCS.show=false;render('flash')">← Previous</button><span class="small">${k+1} / ${deck.length}</span><button class="btn pri" ${k<deck.length-1?"":"disabled"} onclick="FCS.i++;FCS.show=false;render('flash')">Next →</button></div>`;
 document.getElementById("main").innerHTML=h}
const CALC=[
 ["vneu","MAP and CPP","CPP = MAP − ICP · MAP = DBP + ⅓(SBP − DBP)",[["sbp","SBP",120],["dbp","DBP",80],["icp","ICP",35]],v=>{const m=v.dbp+(v.sbp-v.dbp)/3,c=m-v.icp;return `MAP = ${m.toFixed(1)} mmHg · CPP = ${c.toFixed(1)} mmHg — ${c<60?"below 60: ischaemia risk":c>160?"above 160: hypertensive encephalopathy":"within autoregulation (60–160)"}`}],
 ["vcar","Cardiac output","CO = HR × SV",[["hr","HR /min",70],["sv","SV mL",70]],v=>`CO = ${(v.hr*v.sv/1000).toFixed(2)} L/min`],
 ["vcar","SVR (Ohm’s law)","SVR = (MAP − RAP) / CO",[["map","MAP",90],["rap","RAP",5],["co","CO L/min",5]],v=>`SVR = ${((v.map-v.rap)/v.co).toFixed(1)} mmHg·min/L`],
 ["vcar","O₂ content and delivery","CaO₂ = 1.34 × Hb × SaO₂ + 0.003 × PaO₂ · DO₂ = CO × CaO₂",[["hb","Hb g/dL",15],["sa","SaO₂ %",98],["pa","PaO₂",95],["co","CO L/min",5]],v=>{const c=1.34*v.hb*v.sa/100+0.003*v.pa;return `CaO₂ = ${c.toFixed(1)} mL/dL (${(c*10).toFixed(0)} mL/L) · DO₂ = ${(c*10*v.co).toFixed(0)} mL/min`}],
 ["vcar","Fick principle","CO = VO₂ ÷ (CaO₂ − CvO₂)",[["vo2","VO₂ mL/min",250],["ca","CaO₂ mL/L",200],["cv","CvO₂ mL/L",150]],v=>`CO = ${(v.vo2/(v.ca-v.cv)).toFixed(2)} L/min · extraction = ${(100*(v.ca-v.cv)/v.ca).toFixed(0)} %`],
 ["vres","Ventilation","V̇E = R × VT · V̇A = R × (VT − VD)",[["r","RR /min",15],["vt","VT mL",500],["vd","VD mL",150]],v=>`V̇E = ${(v.r*v.vt/1000).toFixed(2)} L/min · V̇A = ${(v.r*(v.vt-v.vd)/1000).toFixed(2)} L/min`],
 ["vres","Alveolar gas & A–a gradient","PAO₂ = FiO₂ × (PB − 47) − PaCO₂/0.8 · A–a = PAO₂ − PaO₂",[["fi","FiO₂",0.21],["pb","PB mmHg",760],["pc","PaCO₂",40],["pa","PaO₂",60]],v=>{const A=v.fi*(v.pb-47)-v.pc/0.8,g=A-v.pa;return `PiO₂ = ${(v.fi*(v.pb-47)).toFixed(0)} · PAO₂ = ${A.toFixed(0)} mmHg · A–a = ${g.toFixed(0)} mmHg → ${g<=15?"normal: hypoventilation or low PiO₂":"increased: V/Q mismatch, shunt or diffusion"}`}],
 ["vres","Poiseuille","R ∝ L / r⁴",[["rf","radius factor (e.g. 0.5)",0.5],["lf","length factor",1]],v=>`Resistance × ${(v.lf/Math.pow(v.rf,4)).toFixed(1)} · flow (same pressure) × ${(Math.pow(v.rf,4)/v.lf).toFixed(3)}`],
];
function calcRun(k){const c=CALC[k];const v={};c[3].forEach(([id])=>v[id]=parseFloat(document.getElementById("cv"+k+id).value));document.getElementById("co"+k).textContent=Object.values(v).some(isNaN)?"—":c[4](v)}
function formView(){let h=listView("Formula center","Every equation of the three lectures + calculators",[1],"","∑");
 h+=`<div class="sec">Calculators</div>`+CALC.map((c,k)=>`<div class="calc ${c[0]}"><h3>${c[1]}</h3><div class="n" style="margin:0 0 8px">${c[2]}</div><div class="row">${c[3].map(([id,l,d])=>`<label>${l} <input id="cv${k}${id}" type="number" step="any" value="${d}" oninput="calcRun(${k})"></label>`).join("")}</div><div class="out" id="co${k}"></div></div>`).join("");
 h+=`<div class="sec" style="margin-top:18px">Formula sheet</div><table class="ft"><tr><th>Equation</th><th>Meaning</th><th>Reference / example</th></tr>`+FORM.map(([g,cls,rows])=>`<tr><td colspan="3" style="background:var(--tint);color:var(--acc);font-weight:700" class="v${cls}">${g}</td></tr>`+rows.map(r=>`<tr><td class="f">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")).join("")+`</table>`;
 document.getElementById("main").innerHTML=h;CALC.forEach((_,k)=>calcRun(k))}

// ===== cloud sync (sync code) =====
const API="https://jsonblob.com/api/jsonBlob";
function syncId(){try{return localStorage.getItem("vf-sync")||""}catch(e){return ""}}
function pack(){let ex=[];try{ex=JSON.parse(localStorage.getItem("vf-exams")||"[]")}catch(e){}return {state,ex,t:Date.now()}}
function unpack(d){state=d.state||{};save();try{localStorage.setItem("vf-exams",JSON.stringify(d.ex||[]))}catch(e){}render("home")}
async function pushCloud(silent){const id=syncId();const body=JSON.stringify(pack());
 try{if(id){const r=await fetch(API+"/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body});if(!r.ok)throw 0;return id}
 const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body});if(!r.ok)throw 0;
 let nid=r.headers.get("x-jsonblob-id")||(r.headers.get("location")||"").split("/").pop();if(!nid)throw 0;localStorage.setItem("vf-sync",nid);return nid}catch(e){if(!silent)alert("Cloud save failed. Use 'Copy backup code' instead.");return null}}
async function pullCloud(id){try{const r=await fetch(API+"/"+id.trim(),{headers:{"Accept":"application/json"}});if(!r.ok)throw 0;const d=await r.json();localStorage.setItem("vf-sync",id.trim());unpack(d);alert("Progress loaded ✔");return true}catch(e){alert("Code not found / no internet.");return false}}
let _st;const _save0=save;save=function(){_save0();if(syncId()){clearTimeout(_st);_st=setTimeout(()=>pushCloud(true),1500)}};
function syncUI(){const id=syncId();const m=document.getElementById("main");nav("sync");
 m.innerHTML=`<div class="card" style="max-width:640px"><h2 style="margin-top:0">☁️ Save & continue on another device</h2>
 <h3>1. Cloud sync code (automatic)</h3>
 ${id?`<p>Your sync code:</p><div style="font:700 22px monospace;background:#eef0f5;color:#1a2440;padding:12px;border-radius:10px;word-break:break-all">${id}</div><p class="small">Every answer is now saved online automatically. On your phone: open the site → ☁️ Account / sync → paste this code → Load.</p><button class="btn" onclick="navigator.clipboard.writeText('${id}');this.textContent='Copied ✔'">📋 Copy code</button> <button class="btn pri" onclick="pushCloud().then(x=>x&&alert('Saved ✔'))">⬆ Save now</button>`
 :`<button class="btn pri" onclick="pushCloud().then(x=>x&&syncUI())">Create my sync code</button>`}
 <p style="margin-top:18px"><b>Already have a code?</b> (from your other device)</p><input id="sc" placeholder="Paste sync code" style="width:100%;padding:11px;border-radius:10px;border:1px solid #ccd;font-size:15px"><button class="btn pri" style="margin-top:8px" onclick="pullCloud(document.getElementById('sc').value).then(x=>x&&syncUI())">⬇ Load my progress</button>
 <h3 style="margin-top:26px">2. Backup code (works offline, always)</h3><p class="small">Copy it, send it to yourself (WhatsApp, mail…), paste it on the other device.</p>
 <button class="btn" onclick="navigator.clipboard.writeText(btoa(unescape(encodeURIComponent(JSON.stringify(pack())))));this.textContent='Copied ✔'">📋 Copy backup code</button>
 <textarea id="bk" placeholder="Paste a backup code here" style="width:100%;height:80px;margin-top:10px;border-radius:10px;padding:8px"></textarea>
 <button class="btn" onclick="try{unpack(JSON.parse(decodeURIComponent(escape(atob(document.getElementById('bk').value.trim())))));alert('Progress restored ✔')}catch(e){alert('Invalid code')}">⬇ Restore backup</button></div>`}

 state={};try{localStorage.removeItem("vf-state");localStorage.removeItem("vf-exams")}catch(e){}EX.list=null;EX.ans={};EX.sub=false;b.dataset.c="";b.textContent="↺ Reset progress";go("home")}
